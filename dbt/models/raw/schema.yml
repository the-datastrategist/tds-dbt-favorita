version: 2

sources:
  - name: favorita_raw
    database: "{{ env_var('GOOGLE_PROJECT_ID') }}"
    schema: "{{ env_var('BQ_RAW_DATASET', 'raw_favorita') }}"
    tables:
      - name: raw_favorita_transactions
        description: >
          The training data includes dates, store and product information, 
          whether that item was being promoted, as well as the sales numbers.

          The purpose of this data is to predict sales for the thousands of 
          product families sold at Favorita stores located in Ecuador.

          See more details at:
          https://www.kaggle.com/competitions/store-sales-time-series-forecasting/data
        columns:
          - name: date
            data_tests:
              - not_null
          - name: store_nbr
            data_tests:
              - not_null
          - name: transactions
            data_tests:
              - dbt_utils.accepted_range:
                  min_value: 0

      - name: raw_favorita_stores
        description: >
          Store metadata, including city, state, type, and cluster. `cluster` is a grouping of similar stores.
        columns:
          - name: store_nbr
            description: Store identifier.
            data_tests:
              - unique
              - not_null
          - name: city
            description: City where the store is located.
          - name: state
            description: State where the store is located.
          - name: type
            description: Store type/format code assigned by Favorita (e.g. A-E).
          - name: cluster
            description: Grouping of similar stores, used for clustering-based analysis.

      - name: raw_favorita_oil
        description: >
          Daily oil price. Includes values during both the train and test data timeframes. 
          (Ecuador is an oil-dependent country and it's economical health is highly vulnerable 
          to shocks in oil prices.)
        columns:
          - name: date
            description: Calendar date of the oil price observation.
            data_tests:
              - unique
              - not_null
          - name: dcoilwtico
            description: >
              Daily WTI (West Texas Intermediate) crude oil price in USD. Null on days without a
              published price (e.g. weekends/holidays), which is expected and not a data quality
              issue.

      - name: raw_favorita_holiday_events
        description: >
          Holidays and Events, with metadata
          - NOTE: Pay special attention to the `transferred` column. A holiday that is transferred officially falls on that calendar day, but was moved to another date by the government. A transferred day is more like a normal day than a holiday. To find the day that it was actually celebrated, look for the corresponding row where type is Transfer. For example, the holiday Independencia de Guayaquil was transferred from 2012-10-09 to 2012-10-12, which means it was celebrated on 2012-10-12. Days that are type Bridge are extra days that are added to a holiday (e.g., to extend the break across a long weekend). These are frequently made up by the type Work Day which is a day not normally scheduled for work (e.g., Saturday) that is meant to payback the Bridge.
          - Additional holidays are days added a regular calendar holiday, for example, as typically happens around Christmas (making Christmas Eve a holiday).
        columns:
          - name: date
            description: Calendar date of the holiday or event.
            data_tests:
              - not_null
          - name: type
            description: Event type (Holiday, Transfer, Bridge, Work Day, Additional, or Event).
            data_tests:
              - accepted_values:
                  values:
                      - Holiday
                      - Transfer
                      - Bridge
                      - Work Day
                      - Additional
                      - Event
          - name: locale
            description: Scope of the event (National, Regional, or Local).
          - name: locale_name
            description: >
              Name of the region or city the event applies to when `locale` is Regional or
              Local; not meaningful for National events.
          - name: description
            description: Free-text name/description of the holiday or event.
          - name: transferred
            description: >
              Whether the holiday was officially moved to another calendar date by the
              government (true/false). See the model-level note on interpreting transferred
              holidays alongside the corresponding Transfer-type row.

      - name: raw_favorita_train
        description: >
          - The training data, comprising time series of features store_nbr, family, and onpromotion as well as the target sales.
          - `store_nbr` identifies the store at which the products are sold.
          - `family` identifies the type of product sold.
          - `sales` gives the total sales for a product family at a particular store at a given date. Fractional values are possible since products can be sold in fractional units (1.5 kg of cheese, for instance, as opposed to 1 bag of chips).
          - `onpromotion` gives the total number of items in a product family that were being promoted at a store at a given date.
          - Negative `unit_sales` values represent returns of that particular item, so they are valid and expected (not a data quality issue).
        columns:
          - name: id
            description: Row identifier for the training observation.
          - name: date
            description: Sales date.
            data_tests:
              - not_null
          - name: store_nbr
            description: Store identifier.
            data_tests:
              - not_null
          - name: item_nbr
            description: Product (item) identifier.
            data_tests:
              - not_null
          - name: unit_sales
            description: >
              Unit sales for the store-item-day. Negative values represent returns of that
              item, so they are valid and expected (not a data quality issue).
          - name: onpromotion
            description: Whether the item was on promotion at the store on that date.

      - name: raw_favorita_test
        description: >
          - The test data, having the same features as the training data. You will predict the target sales for the dates in this file.
          - The dates in the test data are for the 15 days after the last date in the training data.
        columns:
          - name: id
            description: Row identifier for the test observation (used to join predictions to the submission format).
          - name: date
            description: Forecast date.
            data_tests:
              - not_null
          - name: store_nbr
            description: Store identifier.
            data_tests:
              - not_null
          - name: item_nbr
            description: Product (item) identifier.
            data_tests:
              - not_null
          - name: onpromotion
            description: Whether the item is scheduled to be on promotion at the store on that date.

      - name: raw_favorita_items
        description: >
          Product metadata: item identifiers and attributes (e.g. family, class) for items sold at Favorita stores.
        columns:
          - name: item_nbr
            description: Product (item) identifier.
            data_tests:
              - unique
              - not_null
          - name: family
            description: Product family/category (e.g. GROCERY I, BEVERAGES).
            data_tests:
              - not_null
          - name: class
            description: Numeric product classification code, a finer-grained grouping within `family`.
          - name: perishable
            description: >
              Whether the item is perishable (1) or not (0). Perishable items are weighted more
              heavily in the competition's scoring metric.

      - name: raw_favorita_sample_submission
        description: >
          Competition submission template with id and sales columns for the Favorita forecasting leaderboard.
        columns:
          - name: id
            description: Row identifier matching `raw_favorita_test.id`.
          - name: unit_sales
            description: Placeholder/predicted unit sales value to populate for submission.
