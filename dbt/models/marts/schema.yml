  - name: test_forecast_prediction_coverage_detects_incomplete_latest_run
    model: forecast_prediction_coverage
    overrides:
      vars:
        prediction_coverage_minimum_ratio: 0.98
    given:
      - input: ref('stg_forecast_runs')
        rows:
          - {forecast_run_id: run_1, forecast_contract_name: contract_1, forecast_origin: '2026-08-05', started_at: '2026-08-05 10:00:00+00', row_count: 2}
