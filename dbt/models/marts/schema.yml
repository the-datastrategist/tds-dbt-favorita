          - {forecast_run_id: new_run, forecast_contract_name: new_contract, started_at: '2026-08-04', row_count: 1000}
      - input: ref('stg_forecast_cost_events')
        rows:
          - {cost_event_id: a1, forecast_run_id: anomaly_1, forecast_contract_name: anomaly, stage_name: score, environment: dev, service_name: vertex_ai, cost_type: compute, amount_usd: 1, usage_start_at: '2026-08-01'}
          - {cost_event_id: a2, forecast_run_id: anomaly_2, forecast_contract_name: anomaly, stage_name: score, environment: dev, service_name: vertex_ai, cost_type: compute, amount_usd: 1, usage_start_at: '2026-08-02'}
          - {cost_event_id: a3, forecast_run_id: anomaly_3, forecast_contract_name: anomaly, stage_name: score, environment: dev, service_name: vertex_ai, cost_type: compute, amount_usd: 1, usage_start_at: '2026-08-03'}
          - {cost_event_id: a4, forecast_run_id: anomaly_4, forecast_contract_name: anomaly, stage_name: score, environment: dev, service_name: vertex_ai, cost_type: compute, amount_usd: 4, usage_start_at: '2026-08-04'}
          - {cost_event_id: unit, forecast_run_id: over_unit, forecast_contract_name: over_unit, stage_name: score, environment: dev, service_name: bigquery, cost_type: query, amount_usd: 20, usage_start_at: '2026-08-04'}
