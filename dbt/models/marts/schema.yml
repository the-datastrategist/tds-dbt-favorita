          - {forecast_output_id: i1, forecast_run_id: r4, forecast_contract_name: new_contract, series_key: s1, target_timestamp: '2026-08-09 00:00:00+00', target_date: '2026-08-09', horizon: 7, entity_key_json: '{"store_id":1}', prediction_p10: 8, prediction_p50: 10, prediction_p90: 12}
