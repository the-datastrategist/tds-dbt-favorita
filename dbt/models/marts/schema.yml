          - {forecast_output_id: u2, forecast_run_id: r2, forecast_contract_name: uncovered, series_key: s2, target_timestamp: '2026-08-09 00:00:00+00', target_date: '2026-08-09', horizon: 7, entity_key_json: '{"store_id":2}', prediction_p10: 1, prediction_p50: 2, prediction_p90: 3}
          - {forecast_output_id: b1, forecast_run_id: r3, forecast_contract_name: biased, series_key: s1, target_timestamp: '2026-08-09 00:00:00+00', target_date: '2026-08-09', horizon: 7, entity_key_json: '{"store_id":1}', prediction_p10: 0, prediction_p50: 20, prediction_p90: 30}
