version: 2

models:
  - name: forecast_publication_events_audit
    description: Version-level publish, revise, and rollback integration events.
    columns:
      - name: publication_event_id
        data_tests: [unique, not_null]
      - name: event_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [forecast.published, forecast.revised, forecast.rolled_back]

  - name: forecast_delivery_current
    description: Latest append-only delivery state for each immutable run/version/destination.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [forecast_run_id, publication_version, destination]
    columns:
      - name: forecast_run_id
        data_tests: [not_null]
      - name: delivery_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [pending, delivered, failed, abandoned]

  - name: forecast_delivery_health
    description: Latest delivery status with overdue/failure alert semantics.
    columns:
      - name: forecast_contract_name
        data_tests: [not_null]
      - name: delivery_health_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [healthy, pending, overdue, failed, abandoned]
      - name: is_alerting
        data_tests: [not_null]

  - name: forecast_data_drift
    description: Window-over-window standardized mean drift for configured target and feature metrics.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [source_model, metric_name]
    columns:
      - name: source_model
        data_tests: [not_null]
      - name: metric_name
        data_tests: [not_null]
      - name: metric_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [feature, target]
      - name: drift_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [healthy, insufficient_observations, drifted]
      - name: is_alerting
        data_tests: [not_null]

  - name: forecast_pipeline_cost
    description: Latest per-contract forecast cost, allocation quality, and budget/anomaly status.
    columns:
      - name: cost_scope_key
        data_tests: [unique, not_null]
      - name: cost_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - healthy
                  - insufficient_history
                  - cost_data_unavailable
                  - missing_required_labels
                  - over_run_budget
                  - over_unit_budget
                  - cost_anomaly
      - name: is_alerting
        data_tests: [not_null]

  - name: forecast_feature_completeness
    description: Latest feature-date null and entity coverage for configured production feature relations.
    columns:
      - name: feature_model
        data_tests: [unique, not_null]
      - name: feature_completeness_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [healthy, missing_rows, missing_required_values, entity_coverage_low]
      - name: is_alerting
        data_tests: [not_null]

  - name: forecast_publication_freshness
    description: Latest publication age per forecast contract with source-mode-aware stale and missing detection.
    columns:
      - name: forecast_contract_name
        data_tests: [unique, not_null]
      - name: freshness_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fresh, stale, missing, static_demo]
      - name: data_mode
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [static_demo, continuous]
      - name: is_alerting
        data_tests: [not_null]

  - name: forecast_prediction_coverage
    description: Latest run coverage against its frozen expected output cardinality.
    columns:
      - name: forecast_run_id
        data_tests: [unique, not_null]
      - name: forecast_contract_name
        data_tests: [unique, not_null]
      - name: coverage_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [healthy, invalid_scope, missing_predictions, below_threshold]
      - name: is_alerting
        data_tests: [not_null]

  - name: forecast_source_health
    description: Latest source ingestion outcome with mode-aware wall-clock freshness evaluation.
    columns:
      - name: source_name
        data_tests: [unique, not_null]
      - name: data_mode
        data_tests: [not_null]
      - name: health_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [healthy, healthy_static, stale, failed]
      - name: is_alerting
        data_tests: [not_null]

  - name: forecast_pipeline_health
    description: Latest scheduled run per contract with stages, gates, output cardinality, and quantile checks.
    columns:
      - name: forecast_run_id
        data_tests: [unique, not_null]
      - name: forecast_contract_name
        data_tests: [unique, not_null]
      - name: health_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - healthy
                  - failed
                  - gates_failed
                  - missing_eligibility_evidence
                  - eligibility_snapshot_mismatch
                  - unexplained_exclusions
                  - eligibility_accounting_mismatch
                  - eligible_prediction_mismatch
                  - missing_outputs
                  - duplicate_outputs
                  - cardinality_mismatch
                  - missing_quantiles

  - name: forecast_realized_calibration
    description: Realized P10-P90 coverage, median bias, and interval width by contract and horizon.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [forecast_contract_name, horizon]
    columns:
      - name: forecast_contract_name
        data_tests: [not_null]
      - name: horizon
        data_tests: [not_null]
      - name: calibration_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [healthy, insufficient_actuals, under_coverage, material_bias]
      - name: is_alerting
        data_tests: [not_null]

  - name: forecast_visible_drafts
    description: Canonical forecasts exposed only after the scheduled run crosses its atomic draft boundary.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - forecast_run_id
              - entity_key_json
              - target_date
              - horizon
    columns:
      - name: forecast_output_id
        data_tests: [unique, not_null]
      - name: forecast_run_id
        data_tests: [not_null]
      - name: calibration_run_id
        data_tests: [not_null]
      - name: forecast_status
        data_tests:
          - accepted_values:
              arguments:
                values: [draft, approved, published]

  - name: published_forecasts_by_run
    description: Stable explicit-version retrieval contract for immutable published forecasts.
    columns:
      - name: publication_id
        data_tests: [unique, not_null]
      - name: forecast_run_id
        data_tests: [not_null]
      - name: publication_version
        data_tests: [not_null]
      - name: published_value
        data_tests: [not_null]
      - name: calibration_run_id
        data_tests: [not_null]
      - name: feature_availability_hash
        data_tests: [not_null]

  - name: published_forecasts_current
    description: Latest publication for each contract, entity, target, horizon, and destination.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - forecast_contract_name
              - entity_key_json
              - target_date
              - horizon
              - destination
    columns:
      - name: publication_id
        data_tests: [unique, not_null]

  - name: forecast_publication_audit
    description: Publication, approval, delivery, and revision lineage for operations and consumers.
    columns:
      - name: publication_id
        data_tests: [not_null]
      - name: approval_id
        data_tests: [not_null]

  - name: forecast_overrides_audit
    description: Immutable planner adjustments with statistical and approval context.
    columns:
      - name: override_id
        data_tests: [not_null]
      - name: statistical_forecast
        data_tests: [not_null]

  - name: ml_model_lifecycle_current
    description: Latest derived lifecycle state and audit event for every registered candidate.
    columns:
      - name: candidate_id
        data_tests: [unique, not_null]
      - name: lifecycle_state
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [candidate, champion, rejected, retired]

  - name: ml_model_current_champion
    description: At most one latest champion per canonical target, grain, and horizon scope.
    columns:
      - name: candidate_id
        data_tests: [unique, not_null]
      - name: model_scope_key
        data_tests: [unique, not_null]
      - name: lifecycle_state
        data_tests:
          - accepted_values:
              arguments:
                values: [champion]

  - name: bqml_model_train
    description: >
      Creates BigQuery ML models from model_configs in dbt_project.yml. Training data is read from
      intermediate models (default ref int_sales_daily; override via train_ref per config).
      See also int_sales_store_daily, int_sales_store_product_daily, and
      int_sales_store_product_family_daily.
    columns:
      - name: dummy
        description: >
          Constant placeholder column (always 1). This view exists only to satisfy dbt's
          materialization requirements; the actual BigQuery ML `CREATE MODEL` statements run
          in the model's `pre_hook`, so this column carries no analytical meaning.

  - name: bqml_model_predict
    description: >
      Prediction outputs from BigQuery ML models. Feature input defaults to ref(int_sales_daily);
      override via predict_ref in model_configs.
    columns:
      - name: unique_id
        description: Unique identifier for each model prediction run and date.
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: run_date
        description: Date the prediction job was executed.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: model_name
        description: BigQuery ML model name used for prediction.
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              values: [bqml_sales_forecast]
              config:
                severity: warn
      - name: model_version
        description: Model version string from model configuration.
      - name: lifecycle
        description: Lifecycle status from model configuration (e.g., dev, prod).
        data_tests:
          - accepted_values:
              values: [prod, dev]
              config:
                severity: warn
      - name: metric
        description: Target metric name from model configuration (e.g., sales_company).
      - name: interval
        description: Forecast interval/horizon label from model configuration.
      - name: date
        description: Feature date the prediction row was generated from.
      - name: predicted_sales
        description: >
          Predicted value from BigQuery ML (`predicted_<label column>` from ML.PREDICT),
          aliased to a stable name for downstream consumers.
      - name: prediction
        description: Alias of `predicted_sales`; the model's predicted value.
      - name: prediction_timestamp
        description: Timestamp the prediction row was generated.

  - name: bqml_model_evaluate
    description: >
      Evaluation metrics generated by BigQuery ML models. Training data defaults to
      ref(int_sales_daily); override via train_ref in model_configs. In addition to the
      columns below, each row includes the model-type-specific metric columns returned by
      BigQuery's `ML.EVALUATE` (e.g. mean_absolute_error, mean_squared_error, r2_score for
      regressors), which are not enumerated here since they vary by model_type.
    columns:
      - name: unique_id
        description: Unique identifier for each model evaluation run.
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: run_date
        description: Date the evaluation job was executed.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: model_name
        description: BigQuery ML model name used for evaluation.
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              values: [bqml_sales_forecast]
              config:
                severity: warn
      - name: model_version
        description: Model version string from model configuration.
      - name: lifecycle
        description: Lifecycle status from model configuration (e.g., dev, prod).
        data_tests:
          - accepted_values:
              values: [prod, dev]
              config:
                severity: warn
      - name: metric
        description: Target metric name from model configuration (e.g., sales_company).
      - name: interval
        description: Forecast interval/horizon label from model configuration.
      - name: evaluation_timestamp
        description: Timestamp the evaluation row was generated.

  - name: bqml_model_explain
    description: >
      Feature attribution outputs from BigQuery ML explainable predictions. Input defaults to
      ref(int_sales_daily); override via predict_ref in model_configs.
    columns:
      - name: unique_id
        description: Unique identifier for each model explain run and date.
        data_tests:
          - not_null
          - unique:
              config:
                severity: warn
      - name: run_date
        description: Date the explain job was executed.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: model_name
        description: BigQuery ML model name used for explanation.
        data_tests:
          - not_null:
              config:
                severity: warn
          - accepted_values:
              values: [bqml_sales_forecast]
              config:
                severity: warn
      - name: model_version
        description: Model version string from model configuration.
      - name: lifecycle
        description: Lifecycle status from model configuration (e.g., dev, prod).
        data_tests:
          - accepted_values:
              values: [prod, dev]
              config:
                severity: warn
      - name: metric
        description: Target metric name from model configuration (e.g., sales_company).
      - name: interval
        description: Forecast interval/horizon label from model configuration.
      - name: date
        description: Feature date the explanation row was generated from.
      - name: explain_timestamp
        description: Timestamp the explanation row was generated.
      - name: predicted_value
        description: >
          Predicted value from BigQuery ML (`predicted_<label column>` from
          ML.EXPLAIN_PREDICT).
      - name: top_feature_attributions
        description: >
          Array of the top-K feature attributions (SHAP values) driving this prediction,
          as returned by `ML.EXPLAIN_PREDICT`; K is controlled by the
          `bqml_explain_top_k_features` dbt var.

  - name: int_bqml_model_wape
    description: >
      WAPE per BigQuery ML model_name/run_date, joined from bqml_model_predict back to the
      actuals in each model_config's feature table. Fills the gap left by ML.EVALUATE, which
      doesn't return WAPE natively. Feeds ml_model_leaderboard.
    columns:
      - name: model_name
        description: BigQuery ML model name.
        data_tests:
          - not_null
      - name: run_date
        description: Date the prediction job that produced these rows was executed.
        data_tests:
          - not_null
      - name: wape
        description: Weighted absolute percentage error over all predictions for this run_date.

  - name: ml_model_leaderboard
    description: >
      Unified BQML, Vertex holdout, and rolling-origin baseline metrics. Rows are comparable
      only when target, grain, horizon, segment_key_json, and metric_policy all match.
    columns:
      - name: platform
        description: Which platform produced this run.
        data_tests:
          - not_null
          - accepted_values:
              values: [bqml, vertex]
      - name: config_name
        description: Model configuration name (Vertex config_name, or BQML model_name).
        data_tests:
          - not_null
      - name: model_run_id
        description: Vertex training run identifier; null for BQML rows (no equivalent concept).
      - name: model_family
        description: Model family (Vertex model_family, or 'bqml' as a coarse stand-in).
      - name: model_type
        description: Model type/algorithm (e.g. xgboost, random_forest, BOOSTED_TREE_REGRESSOR).
      - name: grain
        description: Forecast grain, e.g. store-day (Vertex) or company-day (BQML).
        data_tests:
          - not_null
      - name: target
        description: Forecast contract target being evaluated.
        data_tests:
          - not_null
      - name: horizon
        description: Forecast horizon in days.
        data_tests:
          - not_null
      - name: segment_key_json
        description: Canonical JSON identifying the evaluated segment; empty object means aggregate.
        data_tests:
          - not_null
      - name: metric_policy
        description: Canonical policy JSON, including evaluation semantics, used for comparability.
        data_tests:
          - not_null
      - name: primary_metric
        description: Metric used to rank candidates inside the comparable partition.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mae, wape, mase, rmsse]
      - name: mase
        description: Mean absolute scaled error for rolling-origin backtest rows when available.
      - name: rmsse
        description: Root mean squared scaled error for rolling-origin backtest rows when available.
      - name: comparable_partition_key
        description: Stable hash of target, grain, horizon, segment, and metric policy.
        data_tests:
          - not_null
      - name: run_at
        description: Timestamp the training/evaluation run completed.
        data_tests:
          - not_null
      - name: mae
        description: Mean absolute error.
      - name: rmse
        description: Root mean squared error.
      - name: r2
        description: R-squared (coefficient of determination).
      - name: wape
        description: >
          Weighted absolute percentage error. For BQML, computed from int_bqml_model_wape
          since ML.EVALUATE doesn't return it natively.

  - name: ml_model_champion
    description: >
      Current champion candidate inside each target/grain/horizon/segment/metric-policy
      partition, selected from each candidate's latest comparable run.
    columns:
      - name: platform
        description: Which platform produced this run.
        data_tests:
          - not_null
      - name: config_name
        description: Model configuration name.
        data_tests:
          - not_null
      - name: grain
        description: Forecast grain, e.g. store-day or company-day.
        data_tests:
          - not_null
      - name: is_champion
        description: >
          True for the single best candidate in the full comparable partition.
        data_tests:
          - not_null
      - name: comparable_partition_key
        description: Stable semantic partition key shared with ml_model_leaderboard.
        data_tests:
          - not_null

  - name: int_vertex_prediction_accuracy_daily
    description: >
      One row per (config_name, forecast_date): live prediction accuracy for Vertex models,
      aggregated from stg_vertex_model_predictions rows where the actual is now known.
      forecast_date (not run_date) is the grouping key, so this table fills in retroactively
      as actuals land. See docs/specs/prediction_accuracy_monitoring.md.
    columns:
      - name: config_name
        description: Name of the model configuration (from model_config.yaml) used for this run.
        data_tests:
          - not_null
      - name: model_family
        description: Model family (e.g. xgboost, random_forest, arima, sarima).
      - name: model_type
        description: Model type/algorithm used for prediction.
      - name: model_run_id
        description: Training run whose model produced these predictions.
      - name: forecast_date
        description: Date being forecasted; the date the actual became known and checkable.
        data_tests:
          - not_null
      - name: n_predictions
        description: Number of predictions with a known actual, aggregated into this row.
      - name: mae
        description: Mean absolute error for this config_name/forecast_date.
      - name: wape
        description: Weighted absolute percentage error for this config_name/forecast_date.
      - name: bias
        description: Mean signed error (prediction minus actual); positive means over-forecasting.

  - name: ml_prediction_accuracy_rolling
    description: >
      Rolling 7-day and 28-day trailing accuracy per config_name, joined to the model_run_id's
      training-time (test) performance for comparison. Powers assert_no_material_accuracy_drift.
    columns:
      - name: config_name
        description: Name of the model configuration (from model_config.yaml) used for this run.
        data_tests:
          - not_null
      - name: forecast_date
        description: Date being forecasted; the date the actual became known and checkable.
        data_tests:
          - not_null
      - name: mae_7d
        description: Trailing 7-day average of daily MAE for this config_name.
      - name: wape_7d
        description: Trailing 7-day average of daily WAPE for this config_name.
      - name: mae_28d
        description: Trailing 28-day average of daily MAE for this config_name.
      - name: wape_28d
        description: Trailing 28-day average of daily WAPE for this config_name.
      - name: train_test_mae
        description: MAE recorded on the held-out test set at training time for this model_run_id.
      - name: train_test_wape
        description: WAPE recorded on the held-out test set at training time for this model_run_id.

unit_tests:
  - name: test_forecast_delivery_current_uses_latest_append_only_event
    model: forecast_delivery_current
    given:
      - input: ref('published_forecasts_by_run')
        rows:
          - {publication_id: p1, forecast_run_id: r1, forecast_contract_name: c1, forecast_contract_hash: h1, publication_version: 1, destination: d1, published_at: '2026-08-11 00:00:00+00'}
          - {publication_id: p2, forecast_run_id: r1, forecast_contract_name: c1, forecast_contract_hash: h1, publication_version: 1, destination: d1, published_at: '2026-08-11 00:00:00+00'}
      - input: ref('stg_forecast_delivery_events')
        rows:
          - {delivery_event_id: e1, forecast_run_id: r1, publication_version: 1, destination: d1, delivery_status: failed, delivery_attempt: 1, occurred_at: '2026-08-11 00:05:00+00'}
          - {delivery_event_id: e2, forecast_run_id: r1, publication_version: 1, destination: d1, delivery_status: delivered, delivery_attempt: 2, delivery_reference: ref1, occurred_at: '2026-08-11 00:10:00+00'}
    expect:
      rows:
        - {forecast_run_id: r1, publication_version: 1, destination: d1, publication_row_count: 2, delivery_event_id: e2, delivery_status: delivered, delivery_attempt: 2, delivery_reference: ref1, status_source: delivery_event}

  - name: test_forecast_delivery_health_alerts_failure_and_clears_on_delivery
    model: forecast_delivery_health
    overrides:
      vars:
        monitoring_evaluated_at: '2026-08-11 01:00:00+00'
        delivery_maximum_pending_minutes: 30
    given:
      - input: ref('forecast_delivery_current')
        rows:
          - {forecast_run_id: failed, forecast_contract_name: c1, publication_version: 1, destination: d1, published_at: '2026-08-11 00:00:00+00', delivery_status: failed, delivery_status_at: '2026-08-11 00:10:00+00'}
          - {forecast_run_id: delivered, forecast_contract_name: c2, publication_version: 1, destination: d1, published_at: '2026-08-11 00:00:00+00', delivery_status: delivered, delivery_status_at: '2026-08-11 00:10:00+00'}
    expect:
      rows:
        - {forecast_run_id: failed, delivery_health_status: failed, is_alerting: true}
        - {forecast_run_id: delivered, delivery_health_status: healthy, is_alerting: false}

  - name: test_forecast_feature_completeness_detects_nulls_and_entity_loss
    model: forecast_feature_completeness
    overrides:
      vars:
        feature_completeness_minimum_ratio: 0.99
        feature_completeness_minimum_entity_ratio: 0.95
    given:
      - input: ref('int_sales_store_daily')
        rows:
          - {date: '2026-08-09', store_nbr: 1, data_split_source: train, sales_store: 10, avg_sales_store_l7d: 9}
          - {date: '2026-08-09', store_nbr: 2, data_split_source: train, sales_store: 20, avg_sales_store_l7d: 18}
          - {date: '2026-08-10', store_nbr: 1, data_split_source: train, sales_store: null, avg_sales_store_l7d: 10}
          - {date: '2026-08-11', store_nbr: 1, data_split_source: test, sales_store: null, avg_sales_store_l7d: null}
    expect:
      rows:
        - {feature_model: int_sales_store_daily, feature_date: '2026-08-10', row_count: 1, entity_count: 1, previous_entity_count: 2, missing_required_value_count: 1, completeness_ratio: 0.75, entity_coverage_ratio: 0.5, feature_completeness_status: missing_required_values, is_alerting: true}

  - name: test_forecast_data_drift_detects_shift_and_sample_readiness
    model: forecast_data_drift
    overrides:
      vars:
        drift_window_days: 2
        drift_minimum_observations: 2
        drift_maximum_standardized_mean_difference: 0.5
    given:
      - input: ref('int_demand_store_daily')
        rows:
          - {date: '2026-08-08', store_nbr: 1, data_split_source: train, observed_sales_units: 10}
          - {date: '2026-08-09', store_nbr: 1, data_split_source: train, observed_sales_units: 10}
          - {date: '2026-08-10', store_nbr: 1, data_split_source: train, observed_sales_units: 30}
          - {date: '2026-08-11', store_nbr: 1, data_split_source: train, observed_sales_units: 30}
      - input: ref('int_sales_store_daily')
        rows:
