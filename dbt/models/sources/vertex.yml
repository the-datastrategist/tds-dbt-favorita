version: 2

# Tables written by vertex/jobs (train, predict, optimize). Apply vertex/ddl/vertex_bq_tables.sql first.
sources:
  - name: vertex_ml
    description: Vertex AI custom training outputs in the analytics dataset
    database: "{{ env_var('GOOGLE_PROJECT_ID') }}"
    schema: "{{ env_var('DBT_DATASET', 'favorita') }}"
    tables:
      - name: ml_model_predictions
        description: Unified prediction rows across model_type (xgboost, random_forest, arima, sarima)
        columns:
          - name: prediction_id
            description: Stable hash per prediction row
          - name: model_run_id
            description: Training run that produced the artifact
          - name: model_id
            description: Logical model version (parameters + features / entity scope)
          - name: model_type
            description: xgboost, random_forest, arima, sarima, etc.

      - name: favorita_model_explain
        description: >
          SHAP feature attributions for tree-based predictions (xgboost, random_forest),
          one row per prediction_id when the model config sets explain.enabled.
        columns:
          - name: explanation_id
            description: Stable hash per explanation row
          - name: prediction_id
            description: Joins 1:1 to ml_model_predictions.prediction_id
          - name: top_feature_attributions
            description: Top-K [{feature, attribution}] SHAP values, sorted by |attribution| desc

      - name: ml_model_metadata
        description: Training run metadata and GCS artifact URIs

      - name: ml_model_performance
        description: Holdout performance metrics per training run

      - name: ml_model_optimize
        description: Hyperparameter optimization trials (Optuna)

      - name: ml_vertex_job_runs
        description: Custom Job and pipeline orchestration audit log

      - name: forecast_contracts
        description: Versioned forecast contract definitions registered by platform implementations

      - name: forecast_runs
        description: Forecast scoring / publication run audit records keyed by forecast_run_id

      - name: forecast_outputs
        description: Canonical forecast output rows with horizon, provenance, and lifecycle status

      - name: forecast_status_history
        description: Forecast lifecycle transition history for approval, publication, supersession, and failure events

      - name: forecast_exceptions
        description: Append-only forecast exceptions requiring operational review

      - name: forecast_overrides
        description: Append-only audited planner adjustments that preserve statistical forecasts

      - name: forecast_approvals
        description: Append-only approval decisions for statistical or planner-adjusted forecasts

      - name: forecast_publications
        description: Append-only versioned publication attempts and downstream delivery outcomes

      - name: forecast_revisions
        description: Append-only supersession and rollback lineage between publication versions

      - name: backtest_runs
        description: Immutable rolling-origin backtest executions and their comparison semantics

      - name: backtest_predictions
        description: Append-only baseline and model predictions produced by rolling-origin backtests

      - name: backtest_metrics
        description: Append-only horizon and segment metrics produced by rolling-origin backtests

      - name: model_candidates
        description: Immutable model candidate registrations and reproducibility evidence

      - name: model_promotion_checks
        description: Append-only configured promotion gate results for each candidate

      - name: model_lifecycle_events
        description: Append-only model state transitions, replacements, waivers, and rollbacks
