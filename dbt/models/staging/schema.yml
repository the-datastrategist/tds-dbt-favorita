version: 2

models:
  - name: stg_model_candidates
    description: Immutable model candidate registrations with a canonical model-scope key.
    columns:
      - name: candidate_id
        data_tests: [unique, not_null]
      - name: model_scope_key
        data_tests: [not_null]
      - name: backtest_run_id
        data_tests: [not_null]

  - name: stg_model_promotion_checks
    description: Promotion gate evidence recorded for model candidates.
    columns:
      - name: promotion_check_id
        data_tests: [unique, not_null]
      - name: candidate_id
        data_tests: [not_null]
      - name: passed
        data_tests: [not_null]

  - name: stg_model_lifecycle_events
    description: Append-only audited state transitions for model candidates.
    columns:
      - name: lifecycle_event_id
        data_tests: [unique, not_null]
      - name: candidate_id
        data_tests: [not_null]
      - name: to_state
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [candidate, champion, rejected, retired]

  - name: stg_backtest_runs
    description: Backtest execution records enriched with explicit comparison semantics.
    columns:
      - name: backtest_run_id
        data_tests: [unique, not_null]
      - name: target
        data_tests: [not_null]
      - name: grain
        data_tests: [not_null]
      - name: model_type
        description: Algorithm used by the configured ML candidate.
        data_tests: [not_null]
      - name: primary_metric
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [mae, wape]

  - name: stg_backtest_predictions
    description: Canonical staging view over append-only rolling-origin predictions.
    columns:
      - name: prediction_id
        data_tests: [unique, not_null]
      - name: backtest_run_id
        data_tests: [not_null]

  - name: stg_backtest_metrics
    description: Backtest metrics joined to run-level target, grain, and metric-policy semantics.
    columns:
      - name: metric_id
        data_tests: [unique, not_null]
      - name: backtest_run_id
        data_tests: [not_null]
      - name: target
        data_tests: [not_null]
      - name: grain
        data_tests: [not_null]
      - name: model_config_name
        description: Configured ML candidate scored alongside the baselines.
        data_tests: [not_null]
      - name: horizon
        data_tests: [not_null]

  - name: stg_favorita_date_spine
    description: >
      One row per calendar day from the first training date through the last test date.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date']
    columns:
      - name: date
        description: Calendar date within the train-through-test range.
        data_tests:
          - unique
          - not_null

  - name: stg_favorita_stores
    description: >
      Store metadata (city, state, type, cluster). One row per store; no date dimension.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['store_nbr']
    columns:
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - unique
          - not_null
      - name: city
        description: City where the store is located.
      - name: state
        description: State where the store is located.
      - name: type
        description: Store type/format code assigned by Favorita (e.g. A-E).
      - name: cluster
        description: Grouping of similar stores, used for clustering-based analysis.

  - name: stg_favorita_holiday_events
    description: >
      Staged holiday and event calendar with surrogate key and date parts.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['id']
    columns:
      - name: id
        description: Surrogate key for date, locale, type, description, and transferred flag.
        data_tests:
          - unique
          - not_null
      - name: date
        description: >
          Calendar date of the holiday or event. The source spans a wider range than the
          train/test date spine, so some holidays legitimately fall outside it (not a data
          quality issue; they simply won't join to any modeling day).
        data_tests:
          - not_null
      - name: event_type
        description: Holiday event type from source (type column).
        data_tests:
          - not_null
          - accepted_values:
              values:
                  - Holiday
                  - Transfer
                  - Bridge
                  - Work Day
                  - Additional
                  - Event
      - name: event_locale
        description: Scope of the event (National, Regional, or Local); from source `locale` column.
      - name: locale_name
        description: >
          Name of the region or city the event applies to when `event_locale` is Regional or
          Local; not meaningful for National events.
      - name: description
        description: Free-text name/description of the holiday or event.
      - name: transferred
        description: >
          Whether the holiday was officially moved to another calendar date by the government
          (true/false); see the model-level note on interpreting transferred holidays alongside
          the corresponding Transfer-type row.
      - name: day_of_month
        description: Day of the month for `date` (1-31).
      - name: day_of_week
        description: Day of week for `date` (1 = Sunday, 7 = Saturday).
      - name: iso_week_of_year
        description: ISO 8601 week number of the year for `date`.
      - name: month
        description: Month number for `date` (1-12).
      - name: quarter
        description: Calendar quarter for `date` (1-4).
      - name: year
        description: Calendar year for `date`.
      - name: week_of_month
        description: Week of the month for `date`, computed as ceil(day_of_month / 7).
      - name: iso_year
        description: ISO 8601 year for `date`; can differ from calendar `year` near year boundaries.
      - name: iso_week
        description: ISO 8601 week number for `date`.
      - name: day_name
        description: Full weekday name for `date` (e.g. Monday).
      - name: month_name
        description: Full month name for `date` (e.g. January).

  - name: stg_favorita_oil
    description: >
      Daily oil price aligned to the project date spine (includes train and test periods).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date']
    columns:
      - name: date
        description: Calendar date.
        data_tests:
          - unique
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: dcoilwtico
        description: >
          Daily WTI crude oil price in USD. Null on days without a published price (e.g.
          weekends/holidays) and on date-spine days added beyond the source's coverage; not a
          data quality issue.

  - name: stg_favorita_train
    description: >
      Staged training sales at store-product-day grain, enriched with product family.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date', 'store_nbr', 'product_id']
    columns:
      - name: id
        description: Surrogate key for date, store, and product.
        data_tests:
          - unique
          - not_null
      - name: date
        description: Sales date.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_stores')
              field: store_nbr
      - name: product_id
        description: Product (item) identifier.
        data_tests:
          - not_null
          - relationships:
              to: source('favorita_raw', 'raw_favorita_items')
              field: item_nbr
      - name: product_family
        description: Product family/category (e.g. GROCERY I, BEVERAGES), joined in from item metadata.
      - name: sales
        description: >
          Unit sales for the store-product-day. Negative values represent returns of that
          item, so they are valid and expected (not a data quality issue).
      - name: on_promotion
        description: Whether the product was on promotion (0 or 1).
        data_tests:
          - accepted_values:
              values: [0, 1]
              quote: false

  - name: stg_favorita_sales_fct
    description: >
      Unified store-product-day sales fact: training rows with unit sales plus the
      test-period scoring grid (sales null where labels are withheld).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date', 'store_nbr', 'product_id']
    columns:
      - name: id
        description: Surrogate key for date, store, and product.
        data_tests:
          - unique
          - not_null
      - name: date
        description: Calendar date (train and test periods).
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_stores')
              field: store_nbr
      - name: product_id
        description: Product (item) identifier.
        data_tests:
          - not_null
          - relationships:
              to: source('favorita_raw', 'raw_favorita_items')
              field: item_nbr
      - name: product_family
        description: Product family/category (e.g. GROCERY I, BEVERAGES), joined in from item metadata.
      - name: sales
        description: >
          Unit sales; null on test-period rows without labels. Negative values represent
          returns of that item, so they are valid and expected (not a data quality issue).
      - name: on_promotion
        description: Whether the product was on promotion (0 or 1).
        data_tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: data_split_source
        description: Indicates whether the row comes from the training period (`train`) or the test/scoring grid (`test`).
        data_tests:
          - accepted_values:
              values: [train, test]

  - name: stg_favorita_test
    description: >
      Staged test-period grid at store-product-day grain for forecasting features.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date', 'store_nbr', 'product_id']
    columns:
      - name: id
        description: Surrogate key for date, store, and product.
        data_tests:
          - unique
          - not_null
      - name: date
        description: Forecast date.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_stores')
              field: store_nbr
      - name: product_id
        description: Product (item) identifier.
        data_tests:
          - not_null
          - relationships:
              to: source('favorita_raw', 'raw_favorita_items')
              field: item_nbr
      - name: product_family
        description: Product family/category (e.g. GROCERY I, BEVERAGES), joined in from item metadata.
      - name: on_promotion
        description: Whether the product was on promotion (0 or 1).
        data_tests:
          - accepted_values:
              values: [0, 1]
              quote: false

  - name: stg_favorita_transactions
    description: >
      Store-level transaction counts by date (cross join of date spine and stores).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date', 'store_nbr']
    columns:
      - name: id
        description: Surrogate key for date and store.
        data_tests:
          - unique
          - not_null
      - name: date
        description: Calendar date.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_stores')
              field: store_nbr
      - name: store_transactions
        description: Transaction count for the store on the date (null when missing in source).
        data_tests:
          - dbt_utils.accepted_range:
              min_value: 0
              config:
                where: store_transactions is not null

  - name: stg_favorita_store_holiday_events
    description: >
      Holiday events expanded to each store (locale and state matching rules).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['store_nbr', 'date']
    columns:
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_stores')
              field: store_nbr
      - name: date
        description: >
          Calendar date. The holiday events source spans a wider range than the train/test
          date spine, so some rows legitimately fall outside it (not a data quality issue).
        data_tests:
          - not_null
      - name: day_of_month
        description: Day of the month for `date` (1-31).
      - name: day_of_week
        description: Day of week for `date` (1 = Sunday, 7 = Saturday).
      - name: iso_week_of_year
        description: ISO 8601 week number of the year for `date`.
      - name: month
        description: Month number for `date` (1-12).
      - name: quarter
        description: Calendar quarter for `date` (1-4).
      - name: year
        description: Calendar year for `date`.
      - name: week_of_month
        description: Week of the month for `date`, computed as ceil(day_of_month / 7).
      - name: iso_year
        description: ISO 8601 year for `date`; can differ from calendar `year` near year boundaries.
      - name: iso_week
        description: ISO 8601 week number for `date`.
      - name: day_name
        description: Full weekday name for `date` (e.g. Monday).
      - name: month_name
        description: Full month name for `date` (e.g. January).
      - name: is_national_holiday
        description: True if a National-locale Holiday event falls on this date.
      - name: is_national_event
        description: True if a National-locale Event falls on this date.
      - name: is_national_additional
        description: True if a National-locale Additional holiday falls on this date.
      - name: is_national_bridge
        description: True if a National-locale Bridge day falls on this date.
      - name: is_national_work_day
        description: True if a National-locale Work Day (payback for a Bridge day) falls on this date.
      - name: is_national_transfer
        description: True if a National-locale Transfer event falls on this date.
      - name: is_regional_holiday
        description: True if a Regional-locale Holiday event applicable to this store's city/state falls on this date.
      - name: is_local_holiday
        description: True if a Local-locale Holiday event applicable to this store's city/state falls on this date.
      - name: is_local_additional
        description: True if a Local-locale Additional holiday applicable to this store's city/state falls on this date.
      - name: is_local_transfer
        description: True if a Local-locale Transfer event applicable to this store's city/state falls on this date.

  - name: stg_vertex_model_predictions
    description: >
      Vertex AI predictions (all model types) from ml_model_predictions.
    columns:
      - name: prediction_id
        description: Unique identifier for the prediction row.
        data_tests:
          - not_null
      - name: predict_run_id
        description: Identifier for the predict job run that produced this row.
      - name: model_run_id
        description: Identifier for the training run whose model produced this prediction.
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: model_id
        description: Identifier of the model artifact used for prediction.
      - name: config_name
        description: Name of the model configuration (from model_config.yaml) used for this run.
      - name: model_family
        description: Model family (e.g. xgboost, random_forest, arima, sarima).
      - name: model_type
        description: Model type/algorithm used for prediction.
        data_tests:
          - not_null
      - name: run_at
        description: Timestamp the predict job executed.
      - name: run_date
        description: Calendar date the predict job executed.
      - name: target_column
        description: Name of the label/target column the model was trained to predict.
      - name: entity_id
        description: Identifier for the forecasted entity (e.g. store or store-product), as defined by the model config's grain.
      - name: store_id
        description: Store identifier for the prediction, when applicable to the model's grain.
      - name: product_id
        description: Product identifier for the prediction, when applicable to the model's grain.
      - name: date
        description: Date the prediction feature row corresponds to.
      - name: forecast_date
        description: Date being forecasted (`date` plus the model's forecast horizon).
      - name: forecast_horizon
        description: Number of days ahead being forecasted.
      - name: actual
        description: Observed actual value for `forecast_date`, when available (e.g. backtesting), else null.
      - name: prediction
        description: Predicted value for `forecast_date`.
      - name: prediction_lower
        description: Lower bound of the prediction interval, when the model produces uncertainty estimates.
      - name: prediction_upper
        description: Upper bound of the prediction interval, when the model produces uncertainty estimates.
      - name: model_artifact_uri
        description: GCS URI of the model artifact used to generate this prediction.

  - name: stg_vertex_model_performance
    description: >
      Vertex AI holdout performance metrics (all model types) from ml_model_performance.
      metric_set is currently always 'test'; train-set metrics are not written to this table
      today (see ml_model_metadata.train_performance JSON instead).
    columns:
      - name: model_run_id
        description: Identifier for the training run these metrics were computed from.
        data_tests:
          - not_null
      - name: model_id
        description: Identifier of the model artifact evaluated.
        data_tests:
          - not_null
      - name: config_name
        description: Name of the model configuration (from model_config.yaml) used for this run.
        data_tests:
          - not_null
      - name: model_family
        description: Model family (e.g. xgboost, random_forest, arima, sarima).
      - name: model_type
        description: Model type/algorithm evaluated.
      - name: run_at
        description: Timestamp the training job executed.
        data_tests:
          - not_null
      - name: metric_set
        description: Which split the metrics were computed on (currently always 'test').
      - name: mean_pred
        description: Mean predicted value over the metric_set.
      - name: mean_actual
        description: Mean actual value over the metric_set.
      - name: mae
        description: Mean absolute error.
      - name: rmse
        description: Root mean squared error.
      - name: mse
        description: Mean squared error.
      - name: r2
        description: R-squared (coefficient of determination).
      - name: mape
        description: Mean absolute percentage error.
      - name: wape
        description: Weighted absolute percentage error (sum of absolute errors / sum of absolute actuals).
      - name: smape
        description: Symmetric mean absolute percentage error.
      - name: bias
        description: Mean signed error (prediction minus actual); positive means over-forecasting.
      - name: median_ae
        description: Median absolute error.

  - name: stg_forecast_contracts
    description: >
      Validated forecast contracts registered by platform implementations. These
      define the target, grain, horizon set, quantiles, feature availability classes,
      hierarchy, reconciliation policy, and demand policy for forecast runs.
    columns:
      - name: forecast_contract_name
        description: Stable contract name.
        data_tests:
          - not_null
      - name: forecast_contract_hash
        description: Stable hash of the contract content.
        data_tests:
          - not_null
      - name: registered_at
        description: Timestamp when this contract version was registered.
      - name: target
        description: Business metric being forecasted.
      - name: dimensions
        description: Entity keys that define the contract grain.
      - name: horizons
        description: Forecast horizons required by the contract.
      - name: quantiles
        description: Probabilistic forecast quantiles requested by the contract.
      - name: is_active
        description: True when this contract version is the active default.

  - name: stg_forecast_runs
    description: >
      Forecast scoring, backtest, approval, or publication run records.
    columns:
      - name: forecast_run_id
        description: Unique identifier for the forecast run.
        data_tests:
          - not_null
      - name: forecast_contract_name
        description: Contract name used by the run.
        data_tests:
          - not_null
      - name: forecast_contract_hash
        description: Contract hash used by the run.
        data_tests:
          - not_null
      - name: run_type
        description: Type of run, such as score, backtest, approve, or publish.
      - name: run_status
        description: Current run status.
      - name: forecast_origin
        description: Forecast origin timestamp.
      - name: data_cutoff
        description: Latest source feature timestamp available to this run.
      - name: source_cutoff_json
        description: JSON object recording source cutoffs available to this run.
      - name: feature_availability_hash
        description: Hash of the feature availability registry used to validate this run.
      - name: feature_materialization_id
        description: Optional feature materialization or plan version identifier.

  - name: stg_forecast_outputs
    description: >
      Canonical forecast output rows. Initial model predict jobs write draft
      statistical forecasts; later operations can add planner overrides, approvals,
      publication values, and supersession history.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - forecast_run_id
            - entity_key_json
            - target_date
            - horizon
    columns:
      - name: forecast_output_id
        description: Stable unique identifier for the forecast output row.
        data_tests:
          - not_null
      - name: source_prediction_id
        description: Legacy model prediction row identifier, when produced from model predictions.
      - name: forecast_run_id
        description: Forecast run that produced this row.
        data_tests:
          - not_null
      - name: forecast_contract_name
        description: Contract name used to produce this forecast.
        data_tests:
          - not_null
      - name: forecast_contract_hash
        description: Contract hash used to produce this forecast.
        data_tests:
          - not_null
      - name: contract_enforced
        description: >
          True when the row was written by the hardened canonical contract writer.
          Legacy append-only rows are exposed as false and remain queryable.
        data_tests:
          - not_null
      - name: forecast_origin
        description: Timestamp when the forecast was issued.
        data_tests:
          - not_null
      - name: target_date
        description: Business date being forecasted.
        data_tests:
          - not_null
      - name: horizon
        description: Number of periods ahead being forecasted.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              inclusive: false
      - name: grain
        description: Comma-delimited contract dimensions for the forecast grain.
      - name: entity_key_json
        description: JSON object of entity key values at the forecast grain.
        data_tests:
          - not_null
      - name: prediction_p10
        description: P10 forecast, when available.
      - name: prediction_p50
        description: P50 forecast; defaults to the point prediction for deterministic models.
      - name: prediction_p90
        description: P90 forecast, when available.
      - name: forecast_strategy
        description: Forecast method selected by the series routing policy.
        data_tests:
          - not_null:
              config:
                where: contract_enforced
      - name: fallback_reason
        description: Reason the preferred entity strategy was not used, when applicable.
      - name: confidence_flag
        description: Routing confidence assigned to the selected forecast strategy.
        data_tests:
          - not_null:
              config:
                where: contract_enforced
          - accepted_values:
              values: ['high', 'medium', 'low']
              config:
                where: contract_enforced
      - name: calibration_method
        description: Interval calibration method applied to the forecast.
      - name: calibration_run_id
        description: Calibration run that produced the forecast intervals.
      - name: hierarchy_version
        description: Hierarchy version used for reconciliation, when applicable.
      - name: reconciliation_method
        description: Reconciliation method applied to the forecast.
      - name: reconciliation_run_id
        description: Reconciliation run identifier, when reconciliation was applied.
      - name: statistical_forecast
        description: Raw model/statistical forecast before planner overrides.
      - name: planner_override
        description: Planner override value, when entered.
      - name: approved_forecast
        description: Approved consensus forecast value.
      - name: published_forecast
        description: Final downstream-published forecast value.
      - name: forecast_status
        description: Lifecycle status for this forecast row.
        data_tests:
          - not_null
          - accepted_values:
              values: ['draft', 'approved', 'published', 'superseded', 'failed']
      - name: model_run_id
        description: Model training run used for this forecast.
      - name: model_id
        description: Model artifact identifier.
        data_tests:
          - not_null
      - name: config_name
        description: Model configuration that produced the forecast.
        data_tests:
          - not_null
      - name: model_type
        description: Model implementation type.
        data_tests:
          - not_null
      - name: feature_version
        description: Stable feature definition or materialization version.
        data_tests:
          - not_null:
              config:
                where: contract_enforced
      - name: code_sha
        description: Source code SHA used for the forecast job.
        data_tests:
          - not_null
      - name: data_cutoff
        description: Latest source data cutoff represented in the forecast.
        data_tests:
          - not_null
      - name: model_artifact_uri
        description: Immutable or versioned model artifact location.
        data_tests:
          - not_null

  - name: stg_forecast_status_history
    description: Forecast lifecycle transition events.
    columns:
      - name: status_event_id
        description: Unique identifier for the status transition event.
        data_tests:
          - not_null
      - name: forecast_output_id
        description: Forecast output row affected by the transition, when row-specific.
      - name: forecast_run_id
        description: Forecast run affected by the transition.
        data_tests:
          - not_null
      - name: previous_status
        description: Status before transition.
      - name: new_status
        description: Status after transition.
        data_tests:
          - not_null
          - accepted_values:
              values: ['draft', 'approved', 'published', 'superseded', 'failed']
      - name: changed_at
        description: Timestamp when the status changed.
        data_tests:
          - not_null
      - name: changed_by
        description: Actor or service responsible for the transition.
        data_tests:
          - not_null

  - name: stg_forecast_exceptions
    description: Append-only exception queue events for forecast outputs requiring review.
    columns:
      - name: exception_id
        description: Deterministic identifier for the logical exception record.
        data_tests: [not_null, unique]
      - name: idempotency_key
        description: Caller-supplied or deterministic key used to make retries safe.
        data_tests: [not_null, unique]
      - name: forecast_output_id
        description: Forecast output that triggered the exception.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_forecast_outputs')
              field: forecast_output_id
      - name: forecast_run_id
        description: Forecast run that produced the output.
        data_tests: [not_null]
      - name: exception_type
        description: Machine-readable exception category.
        data_tests: [not_null]
      - name: severity
        description: Operational severity assigned to the exception.
        data_tests:
          - not_null
          - accepted_values:
              values: ['low', 'medium', 'high', 'critical']
      - name: exception_status
        description: State captured by this exception record.
        data_tests:
          - not_null
          - accepted_values:
              values: ['open', 'acknowledged', 'resolved', 'dismissed']
      - name: detected_at
        description: Timestamp when the exception was detected.
        data_tests: [not_null]
      - name: detected_by
        description: Rule or service that detected the exception.
        data_tests: [not_null]

  - name: stg_forecast_overrides
    description: Audited planner adjustments stored separately from immutable statistical forecasts.
    columns:
      - name: override_id
        description: Deterministic identifier for the override.
        data_tests: [not_null, unique]
      - name: idempotency_key
        description: Key used to deduplicate a retried override command.
        data_tests: [not_null, unique]
      - name: forecast_output_id
        description: Forecast output being adjusted.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_forecast_outputs')
              field: forecast_output_id
      - name: forecast_run_id
        description: Forecast run containing the output.
        data_tests: [not_null]
      - name: override_value
        description: Planner-entered adjusted forecast value.
        data_tests: [not_null]
      - name: reason_code
        description: Required machine-readable rationale for the adjustment.
        data_tests: [not_null]
      - name: comment
        description: Required human-readable audit comment.
        data_tests: [not_null]
      - name: overridden_at
        description: Timestamp when the adjustment was entered.
        data_tests: [not_null]
      - name: overridden_by
        description: Planner or service that entered the adjustment.
        data_tests: [not_null]

  - name: stg_forecast_approvals
    description: Append-only decisions selecting statistical or adjusted forecast values.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [idempotency_key, forecast_output_id]
    columns:
      - name: approval_id
        description: Deterministic identifier for the approval decision.
        data_tests: [not_null, unique]
      - name: idempotency_key
        description: Batch-scoped key used with forecast_output_id to deduplicate a retried approval command.
        data_tests: [not_null]
      - name: forecast_output_id
        description: Forecast output receiving the decision.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_forecast_outputs')
              field: forecast_output_id
      - name: override_id
        description: Selected planner override, when approval uses an adjusted value.
        data_tests:
          - relationships:
              to: ref('stg_forecast_overrides')
              field: override_id
      - name: decision
        description: Approval decision.
        data_tests:
          - not_null
          - accepted_values:
              values: ['approved', 'rejected']
      - name: decided_at
        description: Timestamp when the decision was recorded.
        data_tests: [not_null]
      - name: decided_by
        description: Planner or service responsible for the decision.
        data_tests: [not_null]

  - name: stg_forecast_publications
    description: Immutable, versioned publication attempts and downstream delivery outcomes.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [forecast_output_id, destination, publication_version]
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [idempotency_key, forecast_output_id]
    columns:
      - name: publication_id
        description: Deterministic identifier for a publication version.
        data_tests: [not_null, unique]
      - name: idempotency_key
        description: Batch-scoped key used with forecast_output_id to deduplicate a retried publication command.
        data_tests: [not_null]
      - name: forecast_output_id
        description: Forecast output being published.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_forecast_outputs')
              field: forecast_output_id
      - name: approval_id
        description: Approval decision authorizing publication.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_forecast_approvals')
              field: approval_id
      - name: publication_version
        description: Monotonically increasing version within output and destination.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 1
              inclusive: true
      - name: published_value
        description: Frozen approved value sent downstream.
        data_tests: [not_null]
      - name: destination
        description: Downstream system or integration target.
        data_tests: [not_null]
      - name: delivery_status
        description: Outcome of this immutable publication attempt.
        data_tests:
          - not_null
          - accepted_values:
              values: ['pending', 'delivered', 'failed']
      - name: published_at
        description: Timestamp when publication was attempted.
        data_tests: [not_null]
      - name: published_by
        description: Actor or service responsible for publication.
        data_tests: [not_null]

  - name: stg_forecast_revisions
    description: Supersession and rollback lineage between immutable publication versions.
    columns:
      - name: revision_id
        description: Deterministic identifier for the revision event.
        data_tests: [not_null, unique]
      - name: idempotency_key
        description: Key used to deduplicate a retried revision command.
        data_tests: [not_null, unique]
      - name: forecast_output_id
        description: Forecast output whose publication lineage changed.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_forecast_outputs')
              field: forecast_output_id
      - name: prior_publication_id
        description: Publication superseded by this revision.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_forecast_publications')
              field: publication_id
      - name: replacement_publication_id
        description: New publication version, once created.
        data_tests:
          - relationships:
              to: ref('stg_forecast_publications')
              field: publication_id
      - name: revision_type
        description: Whether the event supersedes a value or rolls back to an earlier value.
        data_tests:
          - not_null
          - accepted_values:
              values: ['supersede', 'rollback']
      - name: reason_code
        description: Required machine-readable rationale for the revision.
        data_tests: [not_null]
      - name: comment
        description: Required human-readable audit comment.
        data_tests: [not_null]
      - name: revised_at
        description: Timestamp when the revision was requested.
        data_tests: [not_null]
      - name: revised_by
        description: Planner or service responsible for the revision.
        data_tests: [not_null]

  - name: stg_vertex_model_explain
    description: >
      SHAP feature attributions for tree-based Vertex predictions (xgboost, random_forest)
      from favorita_model_explain; one row per prediction_id when the model config sets
      explain.enabled.
    columns:
      - name: explanation_id
        description: Unique identifier for the explanation row.
        data_tests:
          - not_null
      - name: prediction_id
        description: Joins 1:1 to stg_vertex_model_predictions.prediction_id.
        data_tests:
          - not_null
      - name: predict_run_id
        description: Identifier for the predict job run that produced this row.
      - name: model_run_id
        description: Identifier for the training run whose model produced this prediction.
      - name: model_id
        description: Identifier of the model artifact used for prediction.
      - name: config_name
        description: Name of the model configuration (from model_config.yaml) used for this run.
      - name: model_family
        description: Model family (e.g. xgboost, random_forest).
      - name: model_type
        description: Model type/algorithm used for prediction. SHAP is only supported for tree models.
        data_tests:
          - not_null
      - name: run_at
        description: Timestamp the predict job executed.
      - name: run_date
        description: Calendar date the predict job executed.
      - name: entity_id
        description: Identifier for the forecasted entity, as defined by the model config's grain.
      - name: store_id
        description: Store identifier for the prediction, when applicable to the model's grain.
      - name: product_id
        description: Product identifier for the prediction, when applicable to the model's grain.
      - name: date
        description: Date the prediction feature row corresponds to.
      - name: predicted_value
        description: Predicted value the SHAP attributions explain (matches ml_model_predictions.prediction).
      - name: base_value
        description: shap.TreeExplainer expected_value; the model's average output before feature attributions.
      - name: top_feature_attributions
        description: >
          Top-K feature attributions (SHAP values) driving this prediction, as an array of
          {feature, attribution} objects sorted by |attribution| descending; K is controlled
          by the config's explain.top_k_features.
      - name: model_artifact_uri
        description: GCS URI of the model artifact used to generate this prediction.

  - name: stg_vertex_model_metadata
    description: Training metadata for Vertex model runs.
    columns:
      - name: model_run_id
        description: Identifier for the training run.
      - name: model_id
        description: Identifier of the resulting model artifact.
      - name: parameter_id
        description: Identifier for the hyperparameter set used to train the model.
      - name: config_name
        description: Name of the model configuration (from model_config.yaml) used for this run.
      - name: model_family
        description: Model family (e.g. xgboost, random_forest, arima, sarima).
      - name: model_type
        description: Model type/algorithm trained.
      - name: run_at
        description: Timestamp the training job executed.
      - name: target_column
        description: Name of the label/target column the model was trained to predict.
      - name: gcs_uri
        description: GCS URI of the primary trained model artifact.
      - name: joblib_gcs_uri
        description: GCS URI of the joblib-serialized model artifact, when applicable.
      - name: manifest_gcs_uri
        description: GCS URI of the model manifest describing the trained artifact(s).
      - name: entity_count
        description: Number of distinct entities (e.g. stores or store-products) considered for training.
      - name: entities_fitted
        description: Number of distinct entities successfully fitted by the model.
      - name: train_row_count
        description: Number of rows used for training.
      - name: test_row_count
        description: Number of rows held out for testing/evaluation.
      - name: parameters
        description: Hyperparameters used to train the model, serialized as JSON.
      - name: test_performance
        description: Test-set performance metrics for the trained model, serialized as JSON.

  - name: stg_vertex_job_runs
    description: Audit log for Vertex Custom Jobs and PipelineJobs.
    columns:
      - name: job_run_id
        description: Unique identifier for the job run (jobs upsert via MERGE on this key).
        data_tests:
          - unique
          - not_null
      - name: config_name
        description: Name of the model configuration (from model_config.yaml) used for this run.
      - name: model_family
        description: Model family (e.g. xgboost, random_forest, arima, sarima).
      - name: model_type
        description: Model type/algorithm used for the job.
      - name: job_step
        description: Pipeline step executed by the job (e.g. train, predict, optimize).
      - name: status
        description: Terminal or in-progress status of the job (e.g. running, succeeded, failed).
      - name: vertex_job_resource
        description: Resource name/identifier of the underlying Vertex AI Custom Job or PipelineJob.
      - name: vertex_experiment
        description: Name of the Vertex AI Experiment the run was logged to, when applicable.
      - name: error_message
        description: Error message captured if the job failed, else null.
      - name: started_at
        description: Timestamp the job started.
      - name: finished_at
        description: Timestamp the job finished, else null while still running.
      - name: duration_sec
        description: Job duration in seconds, computed once `finished_at` is set.
      - name: row_count
        description: Number of rows processed by the job step, when applicable.
      - name: artifact_uri
        description: GCS URI of the primary artifact produced by the job, when applicable.
      - name: git_sha
        description: Git commit SHA of the code that ran the job, for reproducibility.
      - name: image_uri
        description: Container image URI used to run the job.
      - name: pipeline_run_id
        description: Identifier of the parent PipelineJob run, when the job was launched as part of a pipeline.
      - name: optimize_run_id
        description: Identifier of the related hyperparameter optimization run, when applicable.
      - name: project_id
        description: GCP project the job ran in.
      - name: region
        description: GCP region the job ran in.
