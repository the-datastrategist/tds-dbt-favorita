version: 2

models:
  - name: int_sales_daily
    description: >
      Company-level daily training features and labels for forecasting models.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date']
    columns:
      - name: date
        description: Date of the sales label.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: sales_company_l1d
        description: >
          Label column representing daily company sales. Null on test-period rows without
          labels; negative values represent returns and are valid.
        data_tests:
          - not_null:
              config:
                where: "data_split_source = 'train'"
      - name: data_split_source
        description: "Indicates whether the row aggregates training-period data (`train`, with a populated label) or test-period data (`test`, label withheld); taken from the underlying store-product rows."
      - name: day_of_month
        description: "Day of the month for `date` (1-31)."
      - name: day_of_week
        description: "Day of week for `date` (1 = Sunday, 7 = Saturday)."
      - name: iso_week_of_year
        description: "ISO 8601 week number of the year for `date`."
      - name: month
        description: "Month number for `date` (1-12)."
      - name: quarter
        description: "Calendar quarter for `date` (1-4)."
      - name: year
        description: "Calendar year for `date`."
      - name: week_of_month
        description: "Week of the month for `date`, computed as ceil(day_of_month / 7)."
      - name: iso_year
        description: "ISO 8601 year for `date`; can differ from calendar `year` near year boundaries."
      - name: iso_week
        description: "ISO 8601 week number for `date`."
      - name: day_name
        description: "Full weekday name for `date` (e.g. Monday)."
      - name: month_name
        description: "Full month name for `date` (e.g. January)."
      - name: sales_company_n7d_same_dow
        description: "Company-wide sales exactly 7 days after `date` (same day of week, the following week); used to sanity-check/label same-day-of-week comparisons."
      - name: sales_company_n1d
        description: "Sum of company-wide sales over the 1 day(s) after `date` (day 1 through day 1 following); a forward-looking window, distinct from the training label."
      - name: sales_company_n7d
        description: "Sum of company-wide sales over the 7 day(s) after `date` (day 1 through day 7 following); a forward-looking window, distinct from the training label."
      - name: sales_company_n14d
        description: "Sum of company-wide sales over the 14 day(s) after `date` (day 1 through day 14 following); a forward-looking window, distinct from the training label."
      - name: sales_company_n28d
        description: "Sum of company-wide sales over the 28 day(s) after `date` (day 1 through day 28 following); a forward-looking window, distinct from the training label."
      - name: sales_company_n30d
        description: "Sum of company-wide sales over the 30 day(s) after `date` (day 1 through day 30 following); a forward-looking window, distinct from the training label."
      - name: sales_company_n60d
        description: "Sum of company-wide sales over the 60 day(s) after `date` (day 1 through day 60 following); a forward-looking window, distinct from the training label."
      - name: sales_company_n90d
        description: "Sum of company-wide sales over the 90 day(s) after `date` (day 1 through day 90 following); a forward-looking window, distinct from the training label."
      - name: sales_company_l3d
        description: "Sum of company-wide sales over the trailing 3 days (2 day(s) before through `date`, inclusive)."
      - name: sales_company_l7d
        description: "Sum of company-wide sales over the trailing 7 days (6 day(s) before through `date`, inclusive)."
      - name: sales_company_l14d
        description: "Sum of company-wide sales over the trailing 14 days (13 day(s) before through `date`, inclusive)."
      - name: sales_company_l28d
        description: "Sum of company-wide sales over the trailing 28 days (27 day(s) before through `date`, inclusive)."
      - name: sales_company_l30d
        description: "Sum of company-wide sales over the trailing 30 days (29 day(s) before through `date`, inclusive)."
      - name: sales_company_l60d
        description: "Sum of company-wide sales over the trailing 60 days (59 day(s) before through `date`, inclusive)."
      - name: sales_company_l90d
        description: "Sum of company-wide sales over the trailing 90 days (89 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l3d
        description: "Rolling average daily company-wide sales over the trailing 3 days (2 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l7d
        description: "Rolling average daily company-wide sales over the trailing 7 days (6 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l14d
        description: "Rolling average daily company-wide sales over the trailing 14 days (13 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l28d
        description: "Rolling average daily company-wide sales over the trailing 28 days (27 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l30d
        description: "Rolling average daily company-wide sales over the trailing 30 days (29 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l60d
        description: "Rolling average daily company-wide sales over the trailing 60 days (59 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l90d
        description: "Rolling average daily company-wide sales over the trailing 90 days (89 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l180d
        description: "Rolling average daily company-wide sales over the trailing 180 days (179 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l270d
        description: "Rolling average daily company-wide sales over the trailing 270 days (269 day(s) before through `date`, inclusive)."
      - name: avg_sales_company_l360d
        description: "Rolling average daily company-wide sales over the trailing 360 days (359 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l3d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 3 days (2 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l7d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 7 days (6 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l14d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 14 days (13 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l28d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 28 days (27 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l30d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 30 days (29 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l60d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 60 days (59 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l90d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 90 days (89 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l180d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 180 days (179 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l270d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 270 days (269 day(s) before through `date`, inclusive)."
      - name: stddev_sales_company_l360d
        description: "Rolling standard deviation of daily company-wide sales over the trailing 360 days (359 day(s) before through `date`, inclusive)."
      - name: sales_company_p1d
        description: "Sum of company-wide sales over the 1-day period immediately preceding the trailing 1-day window (`sales_company_l1d`); the comparison baseline for `sales_company_l1d_p1d_pct_diff`."
      - name: sales_company_p3d
        description: "Sum of company-wide sales over the 3-day period immediately preceding the trailing 3-day window (`sales_company_l3d`); the comparison baseline for `sales_company_l3d_p3d_pct_diff`."
      - name: sales_company_p7d
        description: "Sum of company-wide sales over the 7-day period immediately preceding the trailing 7-day window (`sales_company_l7d`); the comparison baseline for `sales_company_l7d_p7d_pct_diff`."
      - name: sales_company_p14d
        description: "Sum of company-wide sales over the 14-day period immediately preceding the trailing 14-day window (`sales_company_l14d`); the comparison baseline for `sales_company_l14d_p14d_pct_diff`."
      - name: sales_company_p28d
        description: "Sum of company-wide sales over the 28-day period immediately preceding the trailing 28-day window (`sales_company_l28d`); the comparison baseline for `sales_company_l28d_p28d_pct_diff`."
      - name: sales_company_p30d
        description: "Sum of company-wide sales over the 30-day period immediately preceding the trailing 30-day window (`sales_company_l30d`); the comparison baseline for `sales_company_l30d_p30d_pct_diff`."
      - name: sales_company_p60d
        description: "Sum of company-wide sales over the 60-day period immediately preceding the trailing 60-day window (`sales_company_l60d`); the comparison baseline for `sales_company_l60d_p60d_pct_diff`."
      - name: sales_company_p90d
        description: "Sum of company-wide sales over the 90-day period immediately preceding the trailing 90-day window (`sales_company_l90d`); the comparison baseline for `sales_company_l90d_p90d_pct_diff`."
      - name: avg_sales_company_l1d_l3d_pct_diff
        description: "Percentage difference between `sales_company_l1d` and the trailing 3-day average (`avg_sales_company_l3d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l1d_l7d_pct_diff
        description: "Percentage difference between `sales_company_l1d` and the trailing 7-day average (`avg_sales_company_l7d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l1d_l14d_pct_diff
        description: "Percentage difference between `sales_company_l1d` and the trailing 14-day average (`avg_sales_company_l14d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l1d_l28d_pct_diff
        description: "Percentage difference between `sales_company_l1d` and the trailing 28-day average (`avg_sales_company_l28d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l3d_l7d_pct_diff
        description: "Percentage difference between the trailing 3-day average (`avg_sales_company_l3d`) and the trailing 7-day average (`avg_sales_company_l7d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l3d_l14d_pct_diff
        description: "Percentage difference between the trailing 3-day average (`avg_sales_company_l3d`) and the trailing 14-day average (`avg_sales_company_l14d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l3d_l28d_pct_diff
        description: "Percentage difference between the trailing 3-day average (`avg_sales_company_l3d`) and the trailing 28-day average (`avg_sales_company_l28d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l7d_l14d_pct_diff
        description: "Percentage difference between the trailing 7-day average (`avg_sales_company_l7d`) and the trailing 14-day average (`avg_sales_company_l14d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l7d_l28d_pct_diff
        description: "Percentage difference between the trailing 7-day average (`avg_sales_company_l7d`) and the trailing 28-day average (`avg_sales_company_l28d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l7d_l30d_pct_diff
        description: "Percentage difference between the trailing 7-day average (`avg_sales_company_l7d`) and the trailing 30-day average (`avg_sales_company_l30d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l7d_l60d_pct_diff
        description: "Percentage difference between the trailing 7-day average (`avg_sales_company_l7d`) and the trailing 60-day average (`avg_sales_company_l60d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l7d_l90d_pct_diff
        description: "Percentage difference between the trailing 7-day average (`avg_sales_company_l7d`) and the trailing 90-day average (`avg_sales_company_l90d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l7d_l180d_pct_diff
        description: "Percentage difference between the trailing 7-day average (`avg_sales_company_l7d`) and the trailing 180-day average (`avg_sales_company_l180d`); (numerator / denominator) - 1."
      - name: avg_sales_company_l7d_l360d_pct_diff
        description: "Percentage difference between the trailing 7-day average (`avg_sales_company_l7d`) and the trailing 360-day average (`avg_sales_company_l360d`); (numerator / denominator) - 1."
      - name: sales_company_l1d_p1d_pct_diff
        description: "Period-over-period percentage change between the trailing 1-day sum (`sales_company_l1d`) and the immediately preceding 1-day period (`sales_company_p1d`); (l1d / p1d) - 1."
      - name: sales_company_l3d_p3d_pct_diff
        description: "Period-over-period percentage change between the trailing 3-day sum (`sales_company_l3d`) and the immediately preceding 3-day period (`sales_company_p3d`); (l3d / p3d) - 1."
      - name: sales_company_l7d_p7d_pct_diff
        description: "Period-over-period percentage change between the trailing 7-day sum (`sales_company_l7d`) and the immediately preceding 7-day period (`sales_company_p7d`); (l7d / p7d) - 1."
      - name: sales_company_l14d_p14d_pct_diff
        description: "Period-over-period percentage change between the trailing 14-day sum (`sales_company_l14d`) and the immediately preceding 14-day period (`sales_company_p14d`); (l14d / p14d) - 1."
      - name: sales_company_l28d_p28d_pct_diff
        description: "Period-over-period percentage change between the trailing 28-day sum (`sales_company_l28d`) and the immediately preceding 28-day period (`sales_company_p28d`); (l28d / p28d) - 1."
      - name: sales_company_l30d_p30d_pct_diff
        description: "Period-over-period percentage change between the trailing 30-day sum (`sales_company_l30d`) and the immediately preceding 30-day period (`sales_company_p30d`); (l30d / p30d) - 1."
      - name: sales_company_l60d_p60d_pct_diff
        description: "Period-over-period percentage change between the trailing 60-day sum (`sales_company_l60d`) and the immediately preceding 60-day period (`sales_company_p60d`); (l60d / p60d) - 1."
      - name: sales_company_l90d_p90d_pct_diff
        description: "Period-over-period percentage change between the trailing 90-day sum (`sales_company_l90d`) and the immediately preceding 90-day period (`sales_company_p90d`); (l90d / p90d) - 1."
  - name: int_sales_store_daily
    description: >
