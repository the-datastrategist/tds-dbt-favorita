version: 2

models:
  - name: int_sales_daily
    description: >
      Company-level daily training features and labels for forecasting models.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date']
    columns:
      - name: date
        description: Date of the sales label.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: sales_company_l1d
        description: >
          Label column representing daily company sales. Null on test-period rows without
          labels; negative values represent returns and are valid.
        data_tests:
          - not_null:
              config:
                where: "data_split_source = 'train'"

  - name: int_sales_store_daily
    description: >
      Store-level daily training features and labels for forecasting models.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date', 'store_nbr']
    columns:
      - name: date
        description: Date of the sales label.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_stores')
              field: store_nbr
      - name: sales_store_l1d
        description: >
          Label column representing daily store sales. Null on test-period rows without
          labels; negative values represent returns and are valid.
        data_tests:
          - not_null:
              config:
                where: "data_split_source = 'train'"

  - name: int_sales_store_product_daily
    description: >
      Store-product daily training features and labels for forecasting models.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date', 'store_nbr', 'product_id']
    columns:
      - name: date
        description: Date of the sales label.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_stores')
              field: store_nbr
      - name: product_id
        description: Product identifier.
        data_tests:
          - not_null
          - relationships:
              to: source('favorita_raw', 'raw_favorita_items')
              field: item_nbr
      - name: sales_store_product_l1d
        description: >
          Label column representing daily store-product sales. Null on test-period rows
          without labels; negative values represent returns and are valid.
        data_tests:
          - not_null:
              config:
                where: "data_split_source = 'train'"

  - name: int_sales_store_product_family_daily
    description: >
      Store-product-family daily training features and labels for forecasting models.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: ['date', 'store_nbr', 'product_family']
    columns:
      - name: date
        description: Date of the sales label.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_date_spine')
              field: date
      - name: store_nbr
        description: Store identifier.
        data_tests:
          - not_null
          - relationships:
              to: ref('stg_favorita_stores')
              field: store_nbr
      - name: product_family
        description: Product family identifier.
        data_tests:
          - not_null
      - name: sales_store_family_l1d
        description: >
          Label column representing daily store-product-family sales. Null on test-period
          rows without labels; negative values represent returns and are valid.
        data_tests:
          - not_null:
              config:
                where: "data_split_source = 'train'"
