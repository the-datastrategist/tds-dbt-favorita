name: Security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "19 7 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret history scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan complete Git history with Gitleaks OSS
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --config /repo/.gitleaks.toml --redact --no-banner /repo

  dependencies:
    name: Python vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Audit locked dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          # MLflow 3.15.1 requires cryptography<50. Remove this exception as
          # soon as MLflow supports cryptography 50, which fixes PYSEC-2026-3552.
          # dbt-core 1.12.0 requires sqlparse<0.6. The evaluator only parses
          # trusted repository SQL; remove these exceptions when dbt lifts its cap.
          python -m pip_audit --requirement requirements.txt --strict \
            --ignore-vuln PYSEC-2026-3552 \
            --ignore-vuln CVE-2026-54284 \
            --ignore-vuln CVE-2026-59893 \
            --ignore-vuln CVE-2026-59894 \
            --ignore-vuln CVE-2026-71491

  container:
    name: Container scan and SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build production image
        run: docker build --target production --tag tds-favorita:security-scan .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: tds-favorita:security-scan
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore
          exit-code: "1"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: tds-favorita:security-scan
          format: spdx-json
          output-file: tds-favorita.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tds-favorita-sbom
          path: tds-favorita.spdx.json
          retention-days: 30
