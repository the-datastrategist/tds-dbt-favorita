# Publish the Docsify portal and dbt Docs to GitHub Pages.
# Enable: repo Settings → Pages → Build and deployment → GitHub Actions.

name: Deploy documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  GOOGLE_PROJECT_ID: ci-placeholder
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/ci-service-account.json
  DBT_DATASET: favorita
  BQ_RAW_DATASET: raw_favorita
  DBT_PROFILES_DIR: dbt/profiles
  BQ_LOCATION: US

jobs:
  build:
    name: Build dbt documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Placeholder service account key
        run: echo '{}' > /tmp/ci-service-account.json

      - name: Install dbt packages
        run: dbt deps --project-dir dbt

      - name: Parse and compile
        run: |
          dbt parse --project-dir dbt
          dbt compile --project-dir dbt \
            --no-populate-cache \
            --no-introspect \
            --threads 1 \
            --exclude config.materialized:incremental

      - name: Generate dbt docs
        run: |
          dbt docs generate --project-dir dbt \
            --no-compile \
            --empty-catalog \
            --no-populate-cache \
            --threads 1

      - name: Assemble documentation site
        run: |
          mkdir -p _site/dbt-docs
          cp -R docs/. _site/
          cp -R dbt/target/. _site/dbt-docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
