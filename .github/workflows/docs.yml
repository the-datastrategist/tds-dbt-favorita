# Publish the Docsify portal and dbt Docs to GitHub Pages.
# Enable: repo Settings → Pages → Build and deployment → GitHub Actions.

name: Deploy documentation

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

env:
  GOOGLE_PROJECT_ID: ci-placeholder
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/ci-service-account.json
  DBT_DATASET: favorita
  BQ_RAW_DATASET: raw_favorita
  DBT_PROFILES_DIR: dbt/profiles
  BQ_LOCATION: US

jobs:
  build:
    name: Build dbt documentation site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # dbt-bigquery validates the configured credential file while generating
      # an empty catalog. A syntactically valid, ephemeral key prevents it from
      # falling back to interactive `gcloud auth application-default login`;
      # the docs commands below never use this credential against BigQuery.
      - name: Create offline dbt credentials
        run: |
          openssl genrsa -out /tmp/ci-private-key.pem 2048
          jq --null-input \
            --rawfile private_key /tmp/ci-private-key.pem \
            '{
              type: "service_account",
              project_id: "ci-placeholder",
              private_key_id: "ci-placeholder",
              private_key: $private_key,
              client_email: "dbt-ci@ci-placeholder.iam.gserviceaccount.com",
              client_id: "000000000000000000000",
              auth_uri: "https://accounts.google.com/o/oauth2/auth",
              token_uri: "https://oauth2.googleapis.com/token"
            }' > /tmp/ci-service-account.json

      - name: Install dbt packages
        run: dbt deps --project-dir dbt

      # Keep the Pages build warehouse-independent. Compilation is validated in
      # authenticated CI; this job only needs a manifest and an empty catalog.
      - name: Parse dbt project
        run: dbt parse --project-dir dbt

      - name: Generate dbt docs
        run: |
          dbt docs generate --project-dir dbt \
            --no-compile \
            --empty-catalog \
            --no-populate-cache \
            --threads 1

      - name: Assemble documentation site
        run: |
          mkdir -p _site/dbt-docs
          cp -R docs/. _site/
          cp -R dbt/target/. _site/dbt-docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
