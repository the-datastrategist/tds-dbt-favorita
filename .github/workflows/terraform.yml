name: Terraform

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main, master]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt-validate:
    name: fmt/validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: fmt check (whole repo, once — redundant across matrix legs but cheap)
        run: terraform fmt -check -recursive terraform/

      - name: init (no backend — CI never touches remote state)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  plan-dev:
    name: plan (dev, keyless)
    needs: fmt-validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
      TF_VAR_client_label: ${{ vars.GCP_DEV_CLIENT_LABEL }}
      TF_VAR_caller_member: ${{ vars.GCP_DEV_CALLER_MEMBER }}
      TF_VAR_enable_github_wif: "true"
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_terraform_state_bucket: ${{ vars.GCP_DEV_TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Check dev environment configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_DEV_WIF_PROVIDER }}
          WIF_SERVICE_ACCOUNT: ${{ vars.GCP_DEV_WIF_SERVICE_ACCOUNT }}
        run: |
          for variable in TF_VAR_project_id TF_VAR_client_label TF_VAR_caller_member TF_VAR_terraform_state_bucket WIF_PROVIDER WIF_SERVICE_ACCOUNT; do
            if [ -z "${!variable}" ]; then
              echo "GitHub dev environment variable backing ${variable} is not configured" >&2
              exit 1
            fi
          done

      - id: auth
        name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: init (dev remote state)
        working-directory: terraform/environments/dev
        run: terraform init -input=false -backend-config="bucket=${TF_VAR_terraform_state_bucket}"

      - name: plan (never apply)
        working-directory: terraform/environments/dev
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > terraform-plan.txt

      - name: retain human-readable plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: terraform-dev-plan-${{ github.run_id }}
          path: terraform/environments/dev/terraform-plan.txt
          retention-days: 7
          if-no-files-found: error
