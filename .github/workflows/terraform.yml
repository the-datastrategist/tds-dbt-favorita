name: Terraform

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main, master]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt-validate:
    name: fmt/validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: fmt check (whole repo, once — redundant across matrix legs but cheap)
        run: terraform fmt -check -recursive terraform/

      - name: init (no backend — CI never touches remote state)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

  plan-dev:
    name: plan (dev, keyless)
    needs: fmt-validate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
      TF_VAR_client_label: ${{ vars.GCP_DEV_CLIENT_LABEL }}
      TF_VAR_caller_member: ${{ vars.GCP_DEV_CALLER_MEMBER }}
      TF_VAR_enable_github_wif: "true"
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_terraform_state_bucket: ${{ vars.GCP_DEV_TF_STATE_BUCKET }}
      WIF_PROVIDER: ${{ vars.GCP_DEV_WIF_PROVIDER }}
      WIF_SERVICE_ACCOUNT: ${{ vars.GCP_DEV_WIF_SERVICE_ACCOUNT }}
      DEV_PLAN_CONFIGURED: ${{ vars.GCP_DEV_PROJECT_ID != '' && vars.GCP_DEV_CLIENT_LABEL != '' && vars.GCP_DEV_CALLER_MEMBER != '' && vars.GCP_DEV_TF_STATE_BUCKET != '' && vars.GCP_DEV_WIF_PROVIDER != '' && vars.GCP_DEV_WIF_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Report unconfigured dev plan
        if: env.DEV_PLAN_CONFIGURED != 'true'
        run: |
          echo "::notice::Skipping the authenticated dev plan because the GitHub dev environment is not fully configured. See terraform/README.md#keyless-github-actions-plan."

      - id: auth
        name: Authenticate to Google Cloud with WIF
        if: env.DEV_PLAN_CONFIGURED == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_WIF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        if: env.DEV_PLAN_CONFIGURED == 'true'
        with:
          terraform_wrapper: false

      - name: init (dev remote state)
        if: env.DEV_PLAN_CONFIGURED == 'true'
        working-directory: terraform/environments/dev
        run: terraform init -input=false -backend-config="bucket=${TF_VAR_terraform_state_bucket}"

      - name: plan (never apply)
        if: env.DEV_PLAN_CONFIGURED == 'true'
        working-directory: terraform/environments/dev
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > terraform-plan.txt

      - name: retain human-readable plan
        if: env.DEV_PLAN_CONFIGURED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: terraform-dev-plan-${{ github.run_id }}
          path: terraform/environments/dev/terraform-plan.txt
          retention-days: 7
          if-no-files-found: error
