name: Terraform

on:
  push:
    branches: [main, master]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [main, master]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]

concurrency:
  group: terraform-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt-validate:
    name: fmt/validate (${{ matrix.environment }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: fmt check (whole repo, once — redundant across matrix legs but cheap)
        run: terraform fmt -check -recursive terraform/

      - name: init (no backend — CI never touches remote state)
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform init -backend=false

      - name: validate
        working-directory: terraform/environments/${{ matrix.environment }}
        run: terraform validate

      # No `plan`/`apply` against a live project — CI has no GCP credentials at all (see
      # .github/workflows/ci.yml's placeholder key). Gate live `plan` behind
      # docs/specs/workload_identity_federation.md landing first.
