name: WIF smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev:
    name: Authenticate, plan, and compile
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    env:
      GOOGLE_PROJECT_ID: ${{ vars.GCP_DEV_PROJECT_ID }}
      DBT_DATASET: favorita
      BQ_RAW_DATASET: raw_favorita
      DBT_PROFILES_DIR: dbt/profiles
      BQ_LOCATION: US
      TF_VAR_project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
      TF_VAR_client_label: ${{ vars.GCP_DEV_CLIENT_LABEL }}
      TF_VAR_caller_member: ${{ vars.GCP_DEV_CALLER_MEMBER }}
      TF_VAR_enable_github_wif: "true"
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_terraform_state_bucket: ${{ vars.GCP_DEV_TF_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_DEV_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_DEV_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEV_WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Verify federated identity
        run: gcloud projects describe "$GOOGLE_PROJECT_ID" --format='value(projectId)'

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_wrapper: false

      - name: Verify Terraform plan
        working-directory: terraform/environments/dev
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.GCP_DEV_TF_STATE_BUCKET }}"
          terraform plan -input=false -detailed-exitcode

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Verify dbt authentication and compilation
        run: |
          pip install -r requirements-dev.txt
          dbt deps --project-dir dbt
          dbt debug --project-dir dbt
          dbt parse --project-dir dbt
          dbt compile --project-dir dbt \
            --no-populate-cache --no-introspect --threads 1 \
            --exclude config.materialized:incremental
