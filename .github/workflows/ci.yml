name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONPATH: .
  GOOGLE_PROJECT_ID: ci-placeholder
  GOOGLE_APPLICATION_CREDENTIALS: /tmp/ci-service-account.json
  DBT_DATASET: favorita
  BQ_RAW_DATASET: raw_favorita
  DBT_PROFILES_DIR: dbt/profiles
  BQ_LOCATION: US

jobs:
  python:
    name: Python lint and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Format check
        run: |
          black --check vertex orchestration
          isort --check-only vertex orchestration

      - name: Lint
        run: flake8 vertex orchestration

      - name: Type check
        run: mypy vertex orchestration

      - name: Validate model configs
        run: python -m vertex.config.validate_all

      - name: Validate rolling-origin backtest plan
        run: python -m vertex.jobs.backtest --dry-run

      - name: Validate model lifecycle contract and dry-run plan
        run: python -m vertex.jobs.model_lifecycle plan

      - name: Unit tests
        run: |
          python scripts/check_test_environment.py
          make test DOCKER_RUN=

      - name: Compile Vertex KFP pipeline (no GCP)
        run: |
          python -m vertex.pipelines.compile \
            --pipeline favorita_arima \
            --output /tmp/favorita_arima_pipeline.json \
            --training-image us-central1-docker.pkg.dev/ci/ci:latest \
            --skip-optimize --skip-predict

  dbt:
    name: dbt parse, compile, and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Create offline-only service account key
        run: |
          openssl genrsa -out /tmp/ci-private-key.pem 2048
          jq --null-input \
            --rawfile private_key /tmp/ci-private-key.pem \
            '{
              type: "service_account",
              project_id: "ci-placeholder",
              private_key_id: "ci-placeholder",
              private_key: $private_key,
              client_email: "dbt-ci@ci-placeholder.iam.gserviceaccount.com",
              client_id: "000000000000000000000",
              auth_uri: "https://accounts.google.com/o/oauth2/auth",
              token_uri: "https://oauth2.googleapis.com/token"
            }' > /tmp/ci-service-account.json

      - name: Install dbt packages
        run: dbt deps --project-dir dbt

      - name: Parse dbt project
        run: dbt parse --project-dir dbt

      # BigQuery compile connects to GCP unless cache population and introspection
      # are disabled. Incremental insert_overwrite models still need a live
      # connection, so compile tables/views only (incremental SQL is validated by parse).
      - name: Compile dbt project
        run: |
          dbt compile --project-dir dbt \
            --no-populate-cache \
            --no-introspect \
            --threads 1 \
            --exclude config.materialized:incremental

      - name: Generate dbt docs
        run: |
          dbt docs generate --project-dir dbt \
            --no-compile \
            --empty-catalog \
            --no-populate-cache \
            --threads 1
