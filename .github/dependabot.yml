version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/terraform/environments/dev"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/terraform/environments/prod"
    schedule:
      interval: weekly
