version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
    ignore:
      # MLflow 3.15.1 requires cryptography<50. Dependabot cannot resolve the
      # first non-vulnerable cryptography release until MLflow lifts that cap.
      # Keep this aligned with the temporary pip-audit exception in security.yml.
      - dependency-name: cryptography
        versions: [">=50.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    ignore:
      # The locked ML stack targets Python 3.11. Keep digest and patch updates,
      # but do not open automated runtime-minor/major upgrade PRs.
      - dependency-name: python
        update-types:
          - version-update:semver-minor
          - version-update:semver-major

  - package-ecosystem: terraform
    directory: "/terraform/environments/dev"
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directory: "/terraform/environments/prod"
    schedule:
      interval: weekly
