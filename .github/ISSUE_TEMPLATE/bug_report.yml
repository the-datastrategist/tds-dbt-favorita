name: Bug report
description: Report a reproducible defect using sanitized evidence.
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: What happened and what did you expect? }
    validations: { required: true }
  - type: textarea
    id: reproduction
    attributes: { label: Reproduction, description: Provide minimal commands or steps. }
    validations: { required: true }
  - type: textarea
    id: environment
    attributes: { label: Environment, description: Include relevant versions and deployment mode. }
    validations: { required: true }
  - type: checkboxes
    id: safety
    attributes:
      label: Data safety
      options:
        - label: I removed credentials, client data, and sensitive logs.
          required: true
