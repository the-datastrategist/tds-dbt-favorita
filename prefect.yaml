# Prefect OSS project — deploy with: make prefect-deploy (Docker)
# Docs: orchestration/README.md

name: tds-favorita
prefect-version: ">=3.0.0,<4.0.0"

build: null
push: null
pull: null

deployments:
  # Planned scheduled forecast-publication deployment (not registered until its flow entrypoint
  # exists): route -> forecast -> calibrate -> reconcile -> validate -> approve/publish.
  # Required parameters: contract_name, contract_version, forecast_origin, publication_mode,
  # and idempotency_key. See docs/specs/forecast_operations.md for gates and failure semantics.
  - name: prefect-dbt-run-manual
    entrypoint: orchestration/flows/dbt.py:prefect_dbt_run_flow
    work_pool:
      name: default
    description: Manual trigger for make dbt-run (dbt run, exclude tag:bqml).
    parameters: {}

  - name: prefect-dbt-run-scheduled
    entrypoint: orchestration/flows/dbt.py:prefect_dbt_run_flow
    work_pool:
      name: default
    description: Daily scheduled make dbt-run.
    parameters: {}
    schedules:
      - cron: "0 6 * * *"
        timezone: UTC
        active: true

  # vertex_mode: docker — runs train/predict/optimize inline in this worker's
  # ml-pipeline container (fast, free, no Vertex quota) for manual/local iteration.
  # Never used for scheduled deployments below — see vertex_mode: vertex there.
  - name: prefect-vertex-train-model-manual
    entrypoint: orchestration/flows/vertex.py:prefect_vertex_train_model_flow
    work_pool:
      name: default
    description: Manual Vertex training for one config or all train configs.
    parameters:
      config_name: favorita_store_n1d_xgboost
      train_all: false
      vertex_mode: docker
      sync: false

  # vertex_mode: vertex — scheduled runs always submit a Vertex Custom Job rather
  # than executing training inline in the Prefect worker container. This keeps the
  # worker as a thin orchestrator and avoids duplicating Vertex-managed compute /
  # IAM / experiment tracking with a second local execution path.
  - name: prefect-vertex-train-model-schedule
    entrypoint: orchestration/flows/vertex.py:prefect_vertex_train_model_flow
    work_pool:
      name: default
    description: Scheduled Vertex training (submits a Custom Job; default single config, set train_all in UI/API).
    parameters:
      config_name: favorita_store_n1d_xgboost
      train_all: false
      vertex_mode: vertex
      sync: true
    schedules:
      - cron: "0 7 * * *"
        timezone: UTC
        active: true

  # vertex_mode: docker — see note above; manual/local iteration only.
  - name: prefect-vertex-ml-pipeline-manual
    entrypoint: orchestration/flows/vertex_pipeline.py:prefect_vertex_ml_pipeline_flow
    work_pool:
      name: default
    description: Manual end-to-end ML pipeline (optimize → train → predict).
    parameters:
      pipeline_name: favorita_xgboost
      vertex_mode: docker
      sync: false
      skip_optimize: false
      skip_predict: false

  # vertex_mode: vertex — scheduled runs submit a KFP PipelineJob to Vertex AI
  # instead of running each step inline in the worker container. See note above.
  - name: prefect-vertex-ml-pipeline-scheduled
    entrypoint: orchestration/flows/vertex_pipeline.py:prefect_vertex_ml_pipeline_flow
    work_pool:
      name: default
    description: Weekly scheduled XGBoost ML pipeline (submits a Vertex PipelineJob, full steps).
    parameters:
      pipeline_name: favorita_xgboost
      vertex_mode: vertex
      sync: true
      skip_optimize: false
      skip_predict: false
    schedules:
      - cron: "0 8 * * 0"
        timezone: UTC
        active: true

  - name: prefect-model-lifecycle-manual
    entrypoint: orchestration/flows/model_lifecycle.py:prefect_model_lifecycle_flow
    work_pool:
      name: default
    description: Manually backtest, evaluate promotion gates, and replace the scoped champion.
    parameters:
      actor: prefect-model-lifecycle-manual
      auto_promote: true

  - name: prefect-model-lifecycle-scheduled
    entrypoint: orchestration/flows/model_lifecycle.py:prefect_model_lifecycle_flow
    work_pool:
      name: default
    description: Weekly governed backtest and model promotion after the ML pipeline completes.
    parameters:
      actor: prefect-model-lifecycle-scheduled
      auto_promote: true
    schedules:
      - cron: "0 10 * * 0"
        timezone: UTC
        active: true
