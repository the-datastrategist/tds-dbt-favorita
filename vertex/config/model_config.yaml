defaults:
  project_id: tds-favorita
  region: us-central1
  mlflow:
    enabled: true
    experiment_name: favorita-vertex
    vertex_experiments: true
    # GCS remains canonical; MLflow stores pointers (gcs_model_catalog.json) per train run.
    catalog_artifacts: true
    # Set true (or MLFLOW_REGISTER_MODEL=true) to create/update MLflow Registered Models.
    register_model: false
    registered_model_prefix: favorita
  outputs:
    metadata_table: tds-favorita.favorita.ml_model_metadata
    performance_table: tds-favorita.favorita.ml_model_performance
    prediction_table: tds-favorita.favorita.ml_model_predictions
    forecast_contract_table: tds-favorita.favorita.forecast_contracts
    forecast_runs_table: tds-favorita.favorita.forecast_runs
    forecast_output_table: tds-favorita.favorita.forecast_outputs
    forecast_status_history_table: tds-favorita.favorita.forecast_status_history
    forecast_classification_table: tds-favorita.favorita.forecast_series_classifications
    forecast_contract_path: vertex/config/forecast_contract.yaml
    feature_availability_path: vertex/config/feature_availability.yaml
    optimize_table: tds-favorita.favorita.ml_model_optimize
    job_runs_table: tds-favorita.favorita.ml_vertex_job_runs
    # SHAP feature attributions on predict; only used when a config sets explain.enabled.
    explain_table: tds-favorita.favorita.favorita_model_explain

# Vertex Pipelines (KFP): optimize → train → predict (one model config per pipeline)
pipelines:
  favorita_xgboost:
    config: favorita_store_n1d_xgboost
    steps: [optimize, train, predict]
    vertex:
      enable_caching: true

  favorita_random_forest:
    config: favorita_store_n1d_rf
    steps: [optimize, train, predict]

  favorita_arima:
    config: favorita_store_n1d_arima
    steps: [train, predict]

  favorita_prophet:
    config: favorita_store_n1d_prophet
    steps: [train, predict]

configs:

  - name: favorita_store_h1_7_direct_xgboost
    description: Seven direct XGBoost estimators for exact daily store demand horizons 1 through 7
    model_family: favorita_store_daily
    model_type: xgboost_direct
    inputs:
      train_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        where sales_store_n7d_same_dow is not null
      predict_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        where sales_store_n7d_same_dow is not null
      target_column: sales_store_n1d
      target_columns_by_horizon:
        1: sales_store_n1d
        2: sales_store_n2d
        3: sales_store_n3d
        4: sales_store_n4d
        5: sales_store_n5d
        6: sales_store_n6d
        7: sales_store_n7d_same_dow
      prediction_horizons: [1, 2, 3, 4, 5, 6, 7]
      require_complete_horizon_batch: true
      date_column: date
      entity_column: store_nbr
      id_columns: [store_nbr]
      excluded_columns:
        - store_nbr
        - date
        - sales_store_n1d
        - sales_store_n2d
        - sales_store_n3d
        - sales_store_n4d
        - sales_store_n5d
        - sales_store_n6d
        - sales_store_n7d_same_dow
        - sales_store_n7d
        - sales_store_n14d
        - sales_store_n28d
        - sales_store_n30d
        - sales_store_n60d
        - sales_store_n90d
      gcs_model_path: gs://favorita-vertex-models/
      test_size: 0.2
      model_params:
        objective: reg:squarederror
        eval_metric: mae
        n_estimators: 100
        learning_rate: 0.1
        max_depth: 5
        random_state: 42
        n_jobs: -1
    outputs: {}

  - name: favorita_store_h7_xgboost
    description: Direct XGBoost model for store sales exactly seven days after the forecast origin
    model_family: favorita_store_daily
    model_type: xgboost
    vertex:
      experiment: favorita-vertex
      machine_type: n1-standard-4
      register_model: false
    inputs:
      train_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        where sales_store_n7d_same_dow is not null
      predict_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        where sales_store_n7d_same_dow is not null
      target_column: sales_store_n7d_same_dow
      prediction_horizons: [7]
      date_column: date
      entity_column: store_nbr
      id_columns:
        - store_nbr
      excluded_columns:
        - store_nbr
        - date
        - sales_store_n7d_same_dow
        - sales_store_n1d
        - sales_store_n2d
        - sales_store_n3d
        - sales_store_n4d
        - sales_store_n5d
        - sales_store_n6d
        - sales_store_n7d
        - sales_store_n14d
        - sales_store_n28d
        - sales_store_n30d
        - sales_store_n60d
        - sales_store_n90d
        - sales_company_n7d_same_dow
        - sales_company_n1d
        - sales_company_n7d
        - sales_company_n14d
        - sales_company_n28d
        - sales_company_n30d
        - sales_company_n60d
        - sales_company_n90d
      gcs_model_path: gs://favorita-vertex-models/
      use_optimized_params: false
      forecast_horizon: 7
      train_days: 180
      test_size: 0.2
      trial_count: 50
      objective_metric: mae
      model_run_id:
      model_params:
        n_estimators: 297
        learning_rate: 0.02078105860964659
        booster: gbtree
        objective: reg:squarederror
        eval_metric: mae
        max_depth: 8
        max_leaves: 0
        grow_policy: depthwise
        min_child_weight: 1
        gamma: 0
        max_delta_step: 0
        subsample: 0.7721383354386099
        colsample_bytree: 0.6280688080579032
        colsample_bylevel: 1.0
        colsample_bynode: 1.0
        reg_alpha: 0
        reg_lambda: 1
        scale_pos_weight: 1
        base_score: 0.5
        tree_method: auto
        random_state: 42
        n_jobs: -1
    explain:
      enabled: true
      top_k_features: 20
    outputs: {}

  - name: favorita_store_n1d_xgboost
    description: XGBoost on store daily sales (train, predict, optimize share 
      model_params)
    model_family: favorita_store_daily
    model_type: xgboost
    include_in_run: true
    vertex:
      experiment: favorita-vertex
      machine_type: n1-standard-4
      register_model: false
    inputs:
      train_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) = 1
      predict_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) = 1
      target_column: sales_store_n1d
      date_column: date
      entity_column: store_nbr
      id_columns:
        - store_nbr
      excluded_columns:
        - store_nbr
        - date
        - sales_store_n7d_same_dow
        - sales_store_n1d
        - sales_store_n7d
        - sales_store_n14d
        - sales_store_n28d
        - sales_store_n30d
        - sales_store_n60d
        - sales_store_n90d
        - sales_company_n7d_same_dow
        - sales_company_n1d
        - sales_company_n7d
        - sales_company_n14d
        - sales_company_n28d
        - sales_company_n30d
        - sales_company_n60d
        - sales_company_n90d
      gcs_model_path: gs://favorita-vertex-models/
      use_optimized_params: true
      forecast_horizon: 7
      train_days: 180
      test_size: 0.2
      trial_count: 50
      objective_metric: mae
      model_run_id:
      model_params:
        # Core boosting
        n_estimators: 297
        learning_rate: 0.02078105860964659
        booster: gbtree
        objective: reg:squarederror
        eval_metric: mae
        # Tree structure / complexity control
        max_depth: 8
        max_leaves: 0
        grow_policy: depthwise
        min_child_weight: 1
        gamma: 0
        max_delta_step: 0
        # Row / column sampling
        subsample: 0.7721383354386099
        colsample_bytree: 0.6280688080579032
        colsample_bylevel: 1.0
        colsample_bynode: 1.0
        # Regularization
        reg_alpha: 0
        reg_lambda: 1
        # Misc / reproducibility
        scale_pos_weight: 1
        base_score: 0.5
        tree_method: auto
        random_state: 42
        n_jobs: -1
    explain:
      enabled: true
      # Top-N SHAP feature attributions kept per prediction row (shap.TreeExplainer).
      top_k_features: 20
    outputs: {}


  - name: favorita_store_n1d_rf
    description: Random Forest on store daily sales (shared model_params)
    model_family: favorita_store_daily
    model_type: random_forest
    vertex:
      experiment: favorita-vertex
      machine_type: n1-standard-4
      register_model: false
    inputs:
      train_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) > 1
      predict_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) = 1
      target_column: sales_store_n1d
      date_column: date
      entity_column: store_nbr
      id_columns:
        - store_nbr
      excluded_columns:
        - sales_company_n1d
        - sales_company_n7d
        - sales_company_n14d
        - sales_company_n28d
        - sales_company_n30d
        - sales_company_n60d
        - sales_company_n90d
        - store_nbr
        - date
        - sales_store_l1d
      gcs_model_path: gs://favorita-vertex-models/
      use_optimized_params: true
      forecast_horizon: 7
      test_size: 0.2
      trial_count: 15
      objective_metric: mae
      model_params:
        # Ensemble size
        n_estimators: 360
        criterion: squared_error
        # Tree structure / complexity control
        max_depth: 24
        min_samples_split: 13
        min_samples_leaf: 7
        min_weight_fraction_leaf: 0.0
        max_features: 1.0
        max_leaf_nodes:
        min_impurity_decrease: 0.0
        ccp_alpha: 0.0
        # Bagging
        bootstrap: true
        oob_score: false
        max_samples:
        # Misc / reproducibility
        random_state: 42
        n_jobs: -1
        warm_start: false
    explain:
      enabled: true
      # Top-N SHAP feature attributions kept per prediction row (shap.TreeExplainer).
      top_k_features: 20
    outputs: {}


  - name: favorita_store_n1d_arima
    description: Per-entity ARIMA on store daily sales (shared model_params)
    model_family: favorita_store_daily
    model_type: arima
    vertex:
      experiment: favorita-vertex
      machine_type: n1-standard-4
    inputs:
      train_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) > 1

      predict_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) = 1

      target_column: sales_store_n1d
      date_column: date
      entity_column: store_nbr
      id_columns:
        - store_nbr
      excluded_columns:
        - sales_company_n1d
        - sales_company_n7d
        - sales_company_n14d
        - sales_company_n28d
        - sales_company_n30d
        - sales_company_n60d
        - sales_company_n90d
        - store_nbr
        - date
        - sales_store_l1d
      training_mode: per_entity
      gcs_model_path: gs://favorita-vertex-models/
      test_size: 0.2
      min_train_obs: 60
      max_entities: 200
      predict_scope: holdout
      forecast_horizon: 7
      trial_count: 10
      objective_metric: mae
      model_params:
        # ARIMA(p,d,q); seasonal_order zeroed out (non-seasonal)
        order: [2, 1, 2]
        seasonal_order: [0, 0, 0, 0]
        trend: c
        trend_offset: 1
        # SARIMAX model structure
        enforce_stationarity: false
        enforce_invertibility: false
        concentrate_scale: false
        measurement_error: false
        time_varying_regression: false
        mle_regression: true
        simple_differencing: false
        # Fit / optimizer
        method: lbfgs
        maxiter: 50
        disp: false
    outputs: {}


  - name: favorita_store_n1d_prophet
    description: Per-entity Prophet on store daily sales (additive seasonality; no SHAP)
    model_family: favorita_store_daily
    model_type: prophet
    vertex:
      experiment: favorita-vertex
      machine_type: n1-standard-4
    inputs:
      train_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) > 1
      predict_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) = 1
      target_column: sales_store_n1d
      date_column: date
      entity_column: store_nbr
      id_columns:
        - store_nbr
      training_mode: per_entity
      gcs_model_path: gs://favorita-vertex-models/
      forecast_horizon: 7
      train_days: 180
      test_size: 0.2
      min_train_obs: 90
      max_entities: 100
      predict_scope: holdout
      trial_count: 10
      objective_metric: mae
      model_params:
        # Prophet's own tunables — additive seasonality only in this first cut (see
        # docs/specs/prophet_model_family.md Non-goals: multiplicative is a fast-follow)
        growth: linear
        seasonality_mode: additive
        yearly_seasonality: auto
        weekly_seasonality: auto
        changepoint_prior_scale: 0.05
    # No explain: block — Prophet isn't a tree model, so explain.enabled must stay unset
    # (SHAP_SUPPORTED_MODEL_TYPES in load_config.py already rejects it if set).
    outputs: {}


  - name: favorita_store_n1d_sarima
    description: Per-entity SARIMA on store daily sales (shared model_params)
    model_family: favorita_store_daily
    model_type: sarima
    vertex:
      experiment: favorita-vertex
      machine_type: n1-standard-4
    inputs:
      train_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) > 1
      predict_sql_query: |
        select *
        from `tds-favorita.favorita.int_sales_store_daily`
        qualify ntile(5) over (order by date desc) = 1
      target_column: sales_store_n1d
      date_column: date
      entity_column: store_nbr
      id_columns:
        - store_nbr
      excluded_columns:
        - sales_company_n1d
        - sales_company_n7d
        - sales_company_n14d
        - sales_company_n28d
        - sales_company_n30d
        - sales_company_n60d
        - sales_company_n90d
        - store_nbr
        - date
        - sales_store_l1d
      training_mode: per_entity
      gcs_model_path: gs://favorita-vertex-models/
      test_size: 0.2
      min_train_obs: 90
      max_entities: 100
      predict_scope: holdout
      trial_count: 8
      objective_metric: mae
      model_params:
        # SARIMA(p,d,q)(P,D,Q,s); s=7 for weekly seasonality
        order: [1, 1, 1]
        seasonal_order: [1, 1, 1, 7]
        trend: c
        trend_offset: 1
        # SARIMAX model structure
        enforce_stationarity: false
        enforce_invertibility: false
        concentrate_scale: false
        measurement_error: false
        time_varying_regression: false
        mle_regression: true
        simple_differencing: false
        # Fit / optimizer
        method: lbfgs
        maxiter: 50
        disp: false
    outputs: {}
