destinations:
  operator_log:
    type: log
    minimum_severity: ticket
  forecasting_ops_slack:
    type: slack
    minimum_severity: ticket
    url_env_var: FORECAST_SLACK_WEBHOOK_URL

slos:
  publication_freshness:
    owner: forecasting_ops
    target: 0.99
    window_days: 30
    threshold_minutes: 1440
  prediction_coverage:
    owner: forecasting_ops
    target: 0.99
    window_days: 30
    minimum_ratio: 0.98
  feature_completeness:
    owner: data_platform
    target: 0.99
    window_days: 30
    minimum_ratio: 0.99
  pipeline_availability:
    owner: ml_platform
    target: 0.99
    window_days: 30
    maximum_duration_minutes: 120
  realized_calibration:
    owner: forecasting_science
    target: 0.99
    window_days: 28
    minimum_ratio: 0.80
  data_drift:
    owner: forecasting_science
    target: 0.99
    window_days: 28
  pipeline_cost:
    owner: ml_platform
    target: 0.99
    window_days: 30

policies:
  - name: stale_forecast_publication
    signal: publication_freshness
    severity: page
    destination: forecasting_ops_slack
  - name: prediction_coverage_low
    signal: prediction_coverage
    severity: ticket
    destination: forecasting_ops_slack
  - name: forecast_features_incomplete
    signal: feature_completeness
    severity: page
    destination: forecasting_ops_slack
  - name: forecast_pipeline_unhealthy
    signal: pipeline_health
    severity: page
    destination: forecasting_ops_slack
  - name: forecast_delivery_unhealthy
    signal: delivery_health
    severity: page
    destination: forecasting_ops_slack
  - name: forecast_calibration_unreliable
    signal: realized_calibration
    severity: ticket
    destination: forecasting_ops_slack
  - name: forecast_data_drift_detected
    signal: data_drift
    severity: ticket
    destination: forecasting_ops_slack
  - name: forecast_run_cost_unhealthy
    signal: pipeline_cost
    severity: ticket
    destination: forecasting_ops_slack
